<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>文明都市放置記｜MEGA CITY</title>
<style>
:root{
  --bg:#080b12;
  --panel:rgba(17,21,30,.9);
  --panel2:rgba(23,28,39,.92);
  --line:rgba(255,255,255,.09);
  --text:#f7f2e9;
  --muted:#9ca4b4;
  --gold:#e9be68;
  --green:#75d79a;
  --red:#e77b7b;
  --blue:#7ebaf1;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  overflow:hidden
}

button{
  font:inherit
}

#app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:64px 1fr 72px;
  background:
    radial-gradient(
      circle at 50% 25%,
      #17212b 0,
      #0b1119 40%,
      #070a10 100%
    )
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:rgba(7,9,14,.88);
  backdrop-filter:blur(18px);
  z-index:30
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0
}

.brand-mark{
  width:35px;
  height:35px;
  border-radius:11px;
  background:
    linear-gradient(
      145deg,
      #eed48e,
      #b57c34
    );
  display:grid;
  place-items:center;
  color:#17120a;
  font-weight:1000;
  box-shadow:
    0 6px 24px rgba(226,169,77,.2)
}

.brand-name{
  font-weight:1000;
  letter-spacing:.03em;
  font-size:16px
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:2px
}

.top-right{
  display:flex;
  align-items:center;
  gap:9px
}

.era-pill{
  padding:8px 11px;
  border:1px solid rgba(233,190,104,.25);
  border-radius:12px;
  background:rgba(233,190,104,.07);
  font-size:11px;
  font-weight:900;
  color:#f1ce83
}

.year{
  font-size:12px;
  color:#c1c7d2
}

.year b{
  color:#fff
}


/* =============================
   MAIN
============================= */

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  min-height:0;
  gap:0
}


/* =============================
   MAP
============================= */

.map-shell{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(
      #13202b,
      #091118
    )
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  overflow:hidden;
  isolation:isolate;
  background:#9dbdca
}

#map canvas{
  position:absolute;
  inset:0;
  display:block;
  width:100% !important;
  height:100% !important;
  z-index:0
}

.map-vignette{
  pointer-events:none;
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 45% 45%,
      transparent 42%,
      rgba(2,4,8,.45) 100%
    )
}

.map-hud{
  position:absolute;
  left:16px;
  top:16px;
  display:flex;
  gap:8px;
  pointer-events:none
}

.hud-card{
  background:rgba(10,14,20,.72);
  border:1px solid var(--line);
  border-radius:13px;
  padding:9px 11px;
  backdrop-filter:blur(12px)
}

.hud-label{
  font-size:9px;
  color:var(--muted)
}

.hud-value{
  font-size:14px;
  font-weight:1000;
  margin-top:2px
}

.map-help{
  position:absolute;
  left:16px;
  bottom:16px;
  background:rgba(10,14,20,.65);
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:10px;
  color:#9ea6b3;
  font-size:10px;
  pointer-events:none
}

.map-help b{
  color:#eee
}


/* =============================
   SIDE PANEL
============================= */

.side{
  min-height:0;
  border-left:1px solid var(--line);
  background:rgba(10,13,19,.94);
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  overflow:hidden
}

.side-header{
  padding:17px;
  border-bottom:1px solid var(--line)
}

.side-kicker{
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em
}

.side-title{
  font-size:24px;
  font-weight:1000;
  margin-top:3px
}

.side-desc{
  color:#a7aebc;
  font-size:11px;
  line-height:1.55;
  margin-top:5px
}

.side-body{
  min-height:0;
  overflow:auto;
  padding:14px
}

.section{
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.022);
  margin-bottom:11px
}

.section:last-child{
  margin-bottom:0
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:9px
}

.section-title{
  font-size:11px;
  font-weight:1000;
  color:#e8e2d7
}

.muted{
  color:var(--muted)
}

.big-level{
  font-size:27px;
  font-weight:1000
}

.level-row{
  display:flex;
  align-items:end;
  justify-content:space-between
}

.bar{
  height:7px;
  background:#0b0e15;
  border:1px solid rgba(255,255,255,.06);
  border-radius:999px;
  overflow:hidden;
  margin-top:8px
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      #6b8ee8,
      #e8bd66
    );
  transition:width .3s
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.mini-stat{
  background:rgba(0,0,0,.18);
  border-radius:10px;
  padding:9px
}

.mini-label{
  font-size:9px;
  color:var(--muted)
}

.mini-value{
  font-weight:1000;
  font-size:15px;
  margin-top:2px
}

.prod{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px
}

.prod div{
  font-size:10px;
  color:#aeb4bf;
  background:rgba(0,0,0,.15);
  padding:6px 7px;
  border-radius:8px
}

.prod b{
  color:#eff3f7
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:11px;
  background:
    linear-gradient(
      135deg,
      #e9bd69,
      #b87935
    );
  color:#171106;
  font-weight:1000;
  cursor:pointer;
  box-shadow:
    0 9px 25px rgba(211,147,62,.16)
}

.primary:disabled{
  opacity:.35;
  cursor:not-allowed;
  box-shadow:none
}

.secondary{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
  background:#151a24;
  color:#e8ecf1;
  font-weight:900;
  cursor:pointer
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.side-footer{
  padding:12px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.footer-btn{
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#131821;
  color:#cfd5df;
  font-size:10px;
  font-weight:900;
  cursor:pointer
}


/* =============================
   RESOURCE BAR
============================= */

.bottom{
  display:grid;
  grid-template-columns:
    1.4fr
    1fr
    1fr
    1fr
    1fr
    1fr;

  gap:7px;
  padding:9px 12px;
  border-top:1px solid var(--line);
  background:rgba(7,9,14,.94);
  z-index:20
}

.res{
  min-width:0;
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.018)
}

.res-name{
  font-size:9px;
  color:var(--muted);
  white-space:nowrap
}

.res-val{
  font-size:14px;
  font-weight:1000;
  margin-top:1px;
  white-space:nowrap
}

.res-rate{
  font-size:9px;
  color:var(--green);
  white-space:nowrap
}


/* =============================
   MODAL
============================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(3,5,9,.76);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:18px
}

.overlay.show{
  display:flex
}

.modal{
  width:min(460px,100%);
  border:1px solid var(--line);
  border-radius:19px;
  background:#111722;
  padding:20px;
  box-shadow:0 25px 90px rgba(0,0,0,.55)
}

.modal h2{
  margin:0;
  font-size:22px
}

.modal p{
  font-size:12px;
  color:#b9bfca;
  line-height:1.7
}

.modal .modal-actions{
  display:flex;
  gap:8px;
  margin-top:15px
}


/* =============================
   TOAST
============================= */

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:120;
  background:rgba(11,15,22,.96);
  border:1px solid var(--line);
  padding:10px 13px;
  border-radius:11px;
  font-size:11px;
  transition:.22s;
  box-shadow:0 15px 35px rgba(0,0,0,.3)
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1
}


/* =============================
   TABLET
============================= */

@media(max-width:980px){

  #app{
    grid-template-rows:58px 1fr auto
  }

  .main{
    grid-template-columns:1fr
  }

  .side{
    position:absolute;
    z-index:25;
    right:10px;
    top:10px;
    bottom:10px;
    width:min(360px,calc(100vw - 20px));
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
    transform:
      translateX(
        calc(100% + 18px)
      );
    transition:.25s
  }

  .side.open{
    transform:translateX(0)
  }

  .bottom{
    position:relative;
    grid-template-columns:
      repeat(6,1fr);
    gap:5px;
    padding:7px
  }

  .res{
    padding:6px
  }

  .res-name{
    font-size:8px
  }

  .res-val{
    font-size:12px
  }

  .res-rate{
    font-size:8px
  }

  .map-help{
    bottom:12px;
    left:12px
  }

  .map-hud{
    top:12px;
    left:12px
  }

  .year{
    display:none
  }
}


/* =============================
   PHONE
============================= */

@media(max-width:620px){

  .topbar{
    padding:0 10px
  }

  .brand-name{
    font-size:14px
  }

  .brand-sub{
    font-size:8px
  }

  .era-pill{
    font-size:10px;
    padding:7px 8px
  }

  .bottom{
    grid-template-columns:
      repeat(3,1fr);
    grid-auto-rows:48px;
    overflow:auto
  }

  .res{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    column-gap:5px
  }

  .res-name{
    grid-column:1
  }

  .res-val{
    grid-column:2;
    grid-row:1
  }

  .res-rate{
    grid-column:1 / -1
  }

  .map-hud{
    gap:5px
  }

  .hud-card{
    padding:7px 8px
  }

  .hud-card:nth-child(3){
    display:none
  }
}

</style>
</head>

<body>

<div id="app">

  <!-- TOP -->
  <header class="topbar">

    <div class="brand">

      <div class="brand-mark">
        C
      </div>

      <div>

        <div class="brand-name">
          文明都市放置記
        </div>

        <div class="brand-sub"
             id="brandSub">
          小さな集落から星へ
        </div>

      </div>

    </div>

    <div class="top-right">

      <div class="year">
        YEAR
        <b id="year">1</b>
      </div>

      <div class="era-pill"
           id="eraPill">
        原始時代
      </div>

    </div>

  </header>


  <!-- MAIN -->
  <main class="main">


    <!-- 3D MAP -->
    <section class="map-shell">

      <div id="map"></div>

      <div class="map-vignette"></div>


      <div class="map-hud">

        <div class="hud-card">

          <div class="hud-label">
            人口
          </div>

          <div class="hud-value"
               id="hudPop">
            28 / 40
          </div>

        </div>


        <div class="hud-card">

          <div class="hud-label">
            幸福度
          </div>

          <div class="hud-value"
               id="hudHappy">
            82%
          </div>

        </div>


        <div class="hud-card">

          <div class="hud-label">
            都市規模
          </div>

          <div class="hud-value"
               id="hudCity">
            集落
          </div>

        </div>

      </div>


      <div class="map-help">
        <b>地区</b>タップ→詳細　 <b>ドラッグ</b>→移動　 <b>ホイール/ピンチ</b>→ズーム
      </div>

      <div id="worldMode" style="position:absolute;right:16px;bottom:16px;display:none;padding:9px 12px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(7,12,18,.88);backdrop-filter:blur(12px);font-size:10px;font-weight:1000;color:#e7edf4;pointer-events:none;z-index:5">派遣先をマップで選択</div>

    </section>


    <!-- SIDE -->
    <aside class="side"
           id="side">

      <div class="side-header">

        <div class="side-kicker">
          SELECTED DISTRICT
        </div>

        <div class="side-title"
             id="districtTitle">
          首都広場
        </div>

        <div class="side-desc"
             id="districtDesc">
          文明の中心。人口上限と金生産を支えます。
        </div>

      </div>


      <div class="side-body"
           id="sideBody">
      </div>


      <div class="side-footer">

        <button class="footer-btn"
                onclick="saveGame()">
          💾 セーブ
        </button>

        <button class="footer-btn"
                onclick="resetGame()">
          ↻ リセット
        </button>

      </div>

    </aside>

  </main>


  <!-- RESOURCE BAR -->
  <footer class="bottom">

    <div class="res">

      <div class="res-name">
        🍖 食料
      </div>

      <div class="res-val"
           id="food">
        0
      </div>

      <div class="res-rate"
           id="foodRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        🌲 木材
      </div>

      <div class="res-val"
           id="wood">
        0
      </div>

      <div class="res-rate"
           id="woodRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        🪨 石材
      </div>

      <div class="res-val"
           id="stone">
        0
      </div>

      <div class="res-rate"
           id="stoneRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        ⛓ 鉄
      </div>

      <div class="res-val"
           id="iron">
        0
      </div>

      <div class="res-rate"
           id="ironRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        💰 金
      </div>

      <div class="res-val"
           id="gold">
        0
      </div>

      <div class="res-rate"
           id="goldRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        🔬 科学
      </div>

      <div class="res-val"
           id="science">
        0
      </div>

      <div class="res-rate"
           id="scienceRate">
        +0/s
      </div>

    </div>

  </footer>

</div>


<!-- MODAL -->
<div class="overlay"
     id="overlay">

  <div class="modal">

    <h2 id="modalTitle">
      文明
    </h2>

    <p id="modalText"></p>

    <div class="modal-actions">

      <button class="primary"
              onclick="closeModal()">
        OK
      </button>

    </div>

  </div>

</div>


<div class="toast"
     id="toast">
</div>

<div id="eventBanner" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;z-index:140;width:min(560px,92vw);padding:24px 26px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:rgba(8,13,20,.88);backdrop-filter:blur(18px);box-shadow:0 24px 100px rgba(0,0,0,.5);text-align:center;transition:.35s">
  <div id="eventBannerKicker" style="font-size:10px;letter-spacing:.2em;color:#d5b56d;font-weight:1000">EVENT</div>
  <div id="eventBannerTitle" style="font-size:30px;font-weight:1000;margin-top:8px">発見</div>
  <div id="eventBannerText" style="font-size:12px;color:#bbc5d0;line-height:1.7;margin-top:8px"></div>
</div>

<div id="eraFlash" style="position:fixed;inset:0;z-index:145;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,238,176,.22),rgba(7,10,16,.92) 62%);transition:opacity .45s">
  <div style="text-align:center">
    <div id="eraFlashKicker" style="font-size:11px;letter-spacing:.28em;color:#dbc37e;font-weight:1000">NEW ERA</div>
    <div id="eraFlashTitle" style="font-size:min(60px,11vw);font-weight:1000;margin-top:7px;text-shadow:0 14px 50px rgba(0,0,0,.45)"></div>
    <div id="eraFlashText" style="font-size:13px;color:#d2d9e2;margin-top:10px"></div>
  </div>
</div>

<script type="importmap">

    "three":

  }
}
</script>

function box(

  d,
  mat,
  x=0,
  y=h/2,
  z=0

      new THREE.BoxGeometry(

    );

  m.position.set(
    x,

  );

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}


function cyl(

  y=h/2,
  z=0,

){

    );

  m.position.set(

}

function fmt(n){

  if(!Number.isFinite(n))
    return '∞';

  if(Math.abs(n)<1000)
    return Math.floor(n)
      .toLocaleString('ja-JP');

  const units=[
    'K',
    'M',
    'B',
    'T',
    'Qa',
    'Qi'
  ];

  let x=n;
  let i=-1;

  while(
    Math.abs(x)>=1000 &&
    i<units.length-1
  ){

    x/=1000;
    i++;

  }

  if(x>=100)
    return x.toFixed(0)+units[i];

  if(x>=10)
    return x.toFixed(1)+units[i];

  return x.toFixed(2)+units[i];
}

const WORLD_CHUNK=64;
const WORLD_STREAM_RADIUS=2;

function hash2(x,z){
  let n=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+Math.imul((state.worldSeed||417203)|0,1442695041))|0;
  n=(n^(n>>>13))|0;
  n=Math.imul(n,1274126177);
  n=(n^(n>>>16))|0;
  return (n>>>0)/4294967296;
}

function chunkType(cx,cz){
  if(Math.abs(cx)<=1 && Math.abs(cz)<=1) return 'plains';
  const h=hash2(cx*17+3,cz*31-7);
  const dist=Math.hypot(cx,cz);
  if(dist>5 && h<.30) return 'sea';
  if(h<.46) return 'forest';
  if(h<.60) return 'hills';
  return 'plains';
}

function isForestCleared(id){
  return state.forestClears.includes(id);
}

function addWorldNode(type,id,x,z,radius){
  const color=type==='forest'?0x8dbb63:type==='sea'?0x67d2ec:type==='lake'?0x69d5e3:0xe0bb62;
  const ring=new THREE.Mesh(
    new THREE.RingGeometry(radius*.80,radius,24),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false})
  );
  ring.rotation.x=-Math.PI/2;
  ring.position.set(x,.34,z);
  ring.userData.worldNode={type,id,x,z,radius};
  worldGroup.add(ring);
  worldNodeObjects.push(ring);
}

function addForestPatch(cx,cz){
  const id=`forest_${cx}_${cz}`;
  const x=cx*WORLD_CHUNK+20+hash2(cx+4,cz-5)*24;
  const z=cz*WORLD_CHUNK+20+hash2(cx-8,cz+7)*24;
  addWorldNode('forest',id,x,z,3.4);
  if(isForestCleared(id)) return;
  const count=16+Math.floor(hash2(cx+9,cz+11)*16);
  for(let i=0;i<count;i++){
    const a=i*2.399963+hash2(cx+i,cz-i)*.7;
    const rr=2+(i%7)*.92;
    addLowPolyTree(worldGroup,x+Math.cos(a)*rr,z+Math.sin(a)*rr,.70+(i%4)*.12);
  }
}

function addHillPatch(cx,cz){
  const x=cx*WORLD_CHUNK+32,z=cz*WORLD_CHUNK+32;
  for(let i=0;i<7;i++){
    const a=i*1.73+hash2(cx+i,cz-i)*3;
    const rr=7+(i%3)*6;
    const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2.1+(i%3)*.75,1),makeMaterial(0x78847f,.98));
    rock.position.set(x+Math.cos(a)*rr,.95,z+Math.sin(a)*rr);
    rock.scale.y=1.15+(i%2)*.28;
    worldGroup.add(rock);
  }
}

function addLake(cx,cz){
  const id=`lake_${cx}_${cz}`;
  const x=cx*WORLD_CHUNK+13+hash2(cx,cz)*37;
  const z=cz*WORLD_CHUNK+13+hash2(cx+7,cz-5)*37;
  const rx=7+hash2(cx-3,cz+4)*7;
  const rz=5+hash2(cx+12,cz-1)*6;
  const lake=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.14,32),makeMaterial(0x58b9cb,.20,.08));
  lake.scale.set(rx,1,rz);
  lake.position.set(x,.12,z);
  worldGroup.add(lake);
  addWorldNode('lake',id,x,z,Math.max(rx,rz));
}

function riverCenterX(x){
  return 52 + Math.sin(x/62)*18 + Math.sin(x/21)*3;
}

function addRiverChunk(cx,cz){
  const x=cx*WORLD_CHUNK+32;
  const z=riverCenterX(x);
  const localChunkCenter=cz*WORLD_CHUNK+32;
  if(Math.abs(localChunkCenter-z)>38) return;
  const river=new THREE.Mesh(new THREE.BoxGeometry(WORLD_CHUNK+4,.16,6.5),makeMaterial(0x3f9db4,.18,.08));
  river.position.set(x,.10,z);
  river.rotation.y=Math.sin(x/80)*.10;
  worldGroup.add(river);
  if(state.era>=3) addBridge(worldGroup,x,z,false);
}

function addSeaChunk(cx,cz){
  const x=cx*WORLD_CHUNK+32,z=cz*WORLD_CHUNK+32;
  const sea=new THREE.Mesh(new THREE.BoxGeometry(WORLD_CHUNK+.5,.18,WORLD_CHUNK+.5),makeMaterial(0x2b7895,.14,.08));
  sea.position.set(x,.02,z);
  worldGroup.add(sea);
  addWorldNode('sea',`sea_${cx}_${cz}`,x,z,7.5);
}

function rebuildWorldChunks(force=false){
  const tx=Math.floor(controls.target.x/WORLD_CHUNK);
  const tz=Math.floor(controls.target.z/WORLD_CHUNK);
  const key=`${tx},${tz},${state.era},${state.seaClaims},${state.mapExpansion},${state.forestClears.length}`;
  if(!force && key===worldStreamKey) return;
  worldStreamKey=key;
  while(worldGroup.children.length) worldGroup.remove(worldGroup.children[0]);
  worldNodeObjects.length=0;

  for(let cx=tx-WORLD_STREAM_RADIUS;cx<=tx+WORLD_STREAM_RADIUS;cx++){
    for(let cz=tz-WORLD_STREAM_RADIUS;cz<=tz+WORLD_STREAM_RADIUS;cz++){
      const x=cx*WORLD_CHUNK+32,z=cz*WORLD_CHUNK+32;
      const biome=chunkType(cx,cz);
      const groundColor=biome==='sea'?0x2b6e83:biome==='forest'?0x668f5c:biome==='hills'?0x7b867e:(ERA_GROUND[state.era]||0x718c58);
      const ground=new THREE.Mesh(new THREE.BoxGeometry(WORLD_CHUNK+.35,.42,WORLD_CHUNK+.35),makeMaterial(groundColor,1));
      ground.position.set(x,-.22,z);
      ground.receiveShadow=true;
      worldGroup.add(ground);
      if(biome==='sea') addSeaChunk(cx,cz);
      else if(biome==='forest') addForestPatch(cx,cz);
      else if(biome==='hills') addHillPatch(cx,cz);
      else if(hash2(cx*7,cz*11)<.23) addLake(cx,cz);
      addRiverChunk(cx,cz);
      if(biome==='plains'){
        for(let i=0;i<7;i++){
          const px=x-27+hash2(cx+i,cz-i)*54;
          const pz=z-27+hash2(cx-i,cz+i)*54;
          if(Math.abs(pz-riverCenterX(px))<4.5) continue;
          addLowPolyTree(worldGroup,px,pz,.48+(i%4)*.11);
        }
      }
    }
  }
}

function worldBiomeAt(x,z){
  const cx=Math.floor(x/WORLD_CHUNK),cz=Math.floor(z/WORLD_CHUNK);
  const type=chunkType(cx,cz);
  if(type==='sea') return 'sea';
  const rz=Math.abs(z-riverCenterX(x));
  if(rz<3.8) return 'river';
  const centerX=cx*WORLD_CHUNK+13+hash2(cx,cz)*37;
  const centerZ=cz*WORLD_CHUNK+13+hash2(cx+7,cz-5)*37;
  const dx=(x-centerX)/8, dz=(z-centerZ)/7;
  if(dx*dx+dz*dz<1) return 'lake';
  return type;
}

  rebuildWorldChunks(true);

function makeHouseLots(){
  const lots=[];
  const r=Math.min(150,Math.max(36,state.cityReach+12));
  const spacing=8;
  let id=0;
  for(let gx=-Math.floor(r/spacing);gx<=Math.floor(r/spacing);gx++){
    for(let gz=-Math.floor(r/spacing);gz<=Math.floor(r/spacing);gz++){
      const cx=gx*spacing,cz=gz*spacing;
      for(const ox of [-2.5,0,2.5]){
        for(const oz of [-2.0,0,2.0]){
          const x=cx+ox,z=cz+oz;
          if(x<-r+3||x>r-3||z<-r+3||z>r-3) continue;
          if(Math.abs(z-r*.62)<4.8) continue;
          if(Math.hypot(x,z)<6.0) continue;
          let bad=false;
          for(const d of DISTRICTS){
            if(Math.hypot(x-d.x,z-d.z)<(d.id==='capital'?5.7:4.3)){bad=true;break;}
          }
          if(bad) continue;
          lots.push({id:id++,x,z,dist:Math.hypot(x,z)});
        }
      }
    }
  }
  lots.sort((a,b)=>a.dist-b.dist||a.z-b.z||a.x-b.x);
  return lots;
}

let HOUSE_LOTS=makeHouseLots();

function houseCapacity(){
  return [4,5,7,9,12,18,28,48,90,180][state.era]||4;
}

function getHousingState(){
  const per=houseCapacity();
  const pop=Math.max(0,Math.floor(state.pop));
  const reachable=Math.min(HOUSE_LOTS.length,Math.max(8,Math.floor(state.cityReach*state.cityReach*.8)));
  const houses=Math.min(reachable,Math.max(1,Math.ceil(pop/per)));
  return {population:pop,perHouse:per,houses,capacity:houses*per+state.housingBonus,shortage:Math.max(0,pop-houses*per-state.housingBonus)};
}

function rebuildCitizenAgents(){
  clearCitizens();
  if(!state.pop) return;
  const h=getHousingState();
  const active=DISTRICTS.filter(d=>state.era>=d.unlock && state.districts[d.id].level>0);
  const count=Math.min(85,Math.floor(state.pop));
  for(let i=0;i<count;i++){
    const home=HOUSE_LOTS[i%Math.max(1,h.houses)];
    const job=active[i%Math.max(1,active.length)] || DISTRICTS[0];
    const g=makeCitizen(i,state.era);
    const rx=Math.round(home.x/8)*8, rz=Math.round(home.z/8)*8;
    g.position.set(home.x,.55,home.z);
    g.userData.points=[
      new THREE.Vector3(home.x,.55,home.z),
      new THREE.Vector3(rx,.55,home.z),
      new THREE.Vector3(rx,.55,job.z),
      new THREE.Vector3(job.x,.55,job.z),
      new THREE.Vector3(rx,.55,job.z),
      new THREE.Vector3(rx,.55,home.z),
      new THREE.Vector3(home.x,.55,home.z)
    ];
    g.userData.segment=i%6;
    g.userData.speed=.45+(i%7)*.06;
    g.userData.phase=i*.73;
    citizenGroup.add(g);citizenAgents.push(g);
  }
}

function animateCitizens(dt,t){
  for(const g of citizenAgents){
    const pts=g.userData.points;if(!pts) continue;
    let a=g.userData.segment,b=a+1;
    if(b>=pts.length)b=0;
    const d=new THREE.Vector3().subVectors(pts[b],g.position),len=d.length();
    if(len<.08){g.userData.segment=b;continue;}
    d.normalize();g.position.addScaledVector(d,(g.userData.speed||.6)*dt);g.rotation.y=Math.atan2(d.x,d.z);
    g.position.y=.55+Math.sin(t*.006+g.userData.phase)*.014;
  }
}

/* =========================================================
   BUILDING HEIGHT
========================================================= */

function buildingHeight(
  d,
  level
){

  const eraBoost=
    1+state.era*.12;


  if(d.type==='capital')
    return (
      1.8+
      level*.45
    )*eraBoost;


  if(d.type==='farm')
    return .7+
      level*.08;


  if(d.type==='wood')
    return .9+
      level*.1;


  if(d.type==='stone')
    return 1+
      level*.08;


  if(d.type==='iron')
    return 1.2+
      level*.13;


  if(d.type==='market')
    return 1.1+
      level*.18*
      eraBoost;


  if(d.type==='science')
    return 1.2+
      level*.22*
      eraBoost;


  if(d.type==='industry')
    return 1.5+
      level*.28*
      eraBoost;


  if(d.type==='space')
    return 1.8+
      level*.35*
      eraBoost;


  return 1;

}

/* =========================================================
   COST
========================================================= */

function levelCost(d){

  const l=
    Math.max(
      1,
      state.districts[d.id].level
    );


  const base={

    food:120,
    wood:100,
    stone:70,
    iron:15,
    gold:30,
    science:10

  };


  const mul=
    Math.pow(
      d.growth,
      l-1
    );


  const cost={};


  for(
    const k in base
  ){

    cost[k]=
      base[k]*mul;

  }


  if(d.unlock>=3){

    cost.science*=
      1+
      d.unlock*.5;

  }


  return cost;

}


function canAfford(cost){

  return Object
    .entries(cost)
    .every(
      ([k,v])=>
        (state.resources[k]||0)>=v
    );

}


function pay(cost){

  for(
    const [k,v]
      of Object.entries(cost)
  ){

    state.resources[k]-=v;

  }

}


function formatCost(cost){

  return Object
    .entries(cost)
    .filter(([,v])=>v>0)
    .map(
      ([k,v])=>
        `${resourceIcon(k)} ${fmt(v)}`
    )
    .join('　');

}



function facilityCost(def){
  const mult=Math.pow(1.28,Math.max(0,totalFacilityLevel(def.id)-1));
  const out={};for(const [k,v] of Object.entries(def.cost))out[k]=Math.ceil(v*mult);return out;
}
function canBuildFacility(def){
  if(state.era<def.minEra) return false;
  return canAfford(facilityCost(def));
}
function startBuildFacility(id){
  const def=facilityById(id);if(!def)return;
  if(state.era<def.minEra){toast(`${ERA[def.minEra].name}で解禁`);return;}
  const cost=facilityCost(def);
  if(!canAfford(cost)){toast('建設資源が足りません');return;}
  buildMode=id;
  toast(`${def.icon} ${def.name}の建設場所をマップから選択`);
}
window.startBuildFacility=startBuildFacility;
function cancelBuildMode(){buildMode=null;toast('建設モードを解除');}
window.cancelBuildMode=cancelBuildMode;
function placeFacilityAt(x,z){
  const def=facilityById(buildMode);if(!def)return;
  const sx=Math.round(x),sz=Math.round(z);
  if(Math.hypot(sx,sz)>state.mapRadius){toast('まだこの土地は領土外です。先に領土を拡張してください');return;}
  const biome=worldBiomeAt(sx,sz);
  if(biome==='sea'||biome==='river'||biome==='lake'){toast('水上にはこの設備を建設できません');return;}
  if(Math.hypot(sx,sz)<5.0){toast('中央広場には建設できません');return;}
  for(const d of DISTRICTS){if(Math.hypot(sx-d.x,sz-d.z)<4.8){toast('既存施設に近すぎます');return;}}
  for(const f of state.facilities){if(Math.hypot(sx-f.x,sz-f.z)<3.0){toast('他の設備に近すぎます');return;}}
  const cost=facilityCost(def);if(!canAfford(cost)){buildMode=null;toast('資源が足りなくなりました');return;}
  pay(cost);
  const id=`f_${Date.now()}_${Math.floor(Math.random()*100000)}`;
  state.facilities.push({id,type:def.id,x:sx,z:sz,level:1});
  state.housingBonus+=def.effects?.popMax||0;
  state.happiness=Math.min(100,state.happiness+(def.effects?.happiness||0));
  addLog(`${def.icon}${def.name}を建設しました。`);
  buildMode=null;
  rebuildMap();renderAll();
}

function expandMap(){
  const factor=Math.pow(1.26,state.mapExpansion);
  const cost={wood:Math.ceil(320*factor),stone:Math.ceil(280*factor),gold:Math.ceil(110*factor)};
  if(!canAfford(cost)){toast('領土拡張の資源が足りません');return;}
  pay(cost);
  state.mapRadius=Math.min(100000,state.mapRadius+24+state.mapExpansion*3);
  state.cityReach=Math.min(150,state.cityReach+6);
  state.mapExpansion++;
  addLog(`領土を拡張しました。都市圏が外へ広がり、新しい海・川・森林を探索できるようになりました。`);
  rebuildMap();renderAll();
  toast(`🗺 領土Lv.${state.mapExpansion}：探索範囲拡大`);
}

function beginDispatch(type,x,z,nodeId){
  if(type==='forest' && isForestCleared(nodeId)){toast('この森林区画はすでに開発済みです');cancelDispatch();return;}
  const cost=type==='forest'?{food:55,gold:15}:{food:120,gold:50};
  if(!canAfford(cost)){toast('派遣に必要な資源が足りません');cancelDispatch();return;}
  pay(cost);
  const workers=Math.max(1,Math.min(10,Math.floor(state.pop/5)));
  const duration=type==='forest'?24:40;
  state.expeditions.push({id:`exp_${Date.now()}_${Math.floor(Math.random()*99999)}`,type,x,z,nodeId,workers,duration,remaining:duration});
  addLog(type==='forest'?`🌲 ${workers}人の伐採隊を派遣しました。`:`⚓ ${workers}人の航海隊を派遣しました。`);
  cancelDispatch();rebuildMap();renderAll();
  toast(type==='forest'?'伐採隊が出発しました':'航海隊が出港しました');
}

function completeDispatch(e){
  if(e.type==='forest'){
    const wood=Math.round(e.workers*(40+state.era*9));
    state.resources.wood=(state.resources.wood||0)+wood;
    if(e.nodeId && !state.forestClears.includes(e.nodeId)) state.forestClears.push(e.nodeId);
    addLog(`🌲 伐採隊が帰還。木材+${wood}`);
    showBanner('FOREST OPERATION','森林開発完了',`伐採隊${e.workers}人が木材${wood}を持ち帰りました。`,1500);
  }else{
    const gold=Math.round(90+e.workers*25+state.era*25);
    const power=e.workers*2+state.era+1;
    state.oceanPower+=power;
    state.seaClaims++;
    state.resources.gold=(state.resources.gold||0)+gold;
    state.mapRadius=Math.min(100000,state.mapRadius+28);
    addLog(`⚓ 海域を制圧。新航路を確保し金+${gold}`);
    showBanner('OCEAN CLAIM','海域制圧',`新しい航路を確保。金 +${gold}　制海力 +${power}`,1700);
  }
  state.expeditions=state.expeditions.filter(x=>x.id!==e.id);
  rebuildMap();renderAll();
}

function simulateExpeditions(sec){
  for(const e of [...state.expeditions]){
    e.remaining-=sec;
    if(e.remaining<=0) completeDispatch(e);
  }
}

function makeDigger(){
  const g=new THREE.Group();
  const shirt=makeMaterial(0x7a6248,.9),skin=makeMaterial(0xd79b73,.9),tool=makeMaterial(0x51463d,.78);
  g.add(new THREE.Mesh(new THREE.CapsuleGeometry(.12,.22,3,5),shirt));g.children[0].position.y=.28;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),skin);h.position.y=.52;g.add(h);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.07,.38,.07),shirt);arm.position.set(.18,.38,0);arm.rotation.z=-.65;g.add(arm);
  const pick=box(.06,.70,.05,tool,.35,.55,0);pick.rotation.z=-.95;g.add(pick);
  return {group:g,pick};
}

function triggerDiscovery(){
  if(discovery||state.discoveryCooldown>0)return;
  const x=-10,z=-7;
  const rig=makeDigger();rig.group.position.set(x,.52,z+1.7);effectGroup.add(rig.group);
  const hole=new THREE.Mesh(new THREE.CylinderGeometry(.56,.70,.10,18),makeMaterial(0x28221d,1));hole.position.set(x,.43,z);effectGroup.add(hole);
  const oreMat=makeMaterial(0x8a6852,.45,.4,0x5d2f22,.1);
  const ore= new THREE.Mesh(new THREE.OctahedronGeometry(.24,0),oreMat);ore.position.set(x,.50,z);ore.scale.set(.25,.2,.25);effectGroup.add(ore);
  discovery={rig,hole,ore,x,z,t:0,phase:'zoom',originPos:camera.position.clone(),originTarget:controls.target.clone(),originZoom:camera.zoom};
  controls.enabled=false;showBanner('SUDDEN DISCOVERY','地中から何かが出てきた！','採掘区の住民が掘削中に異常な光を発見しました。',2400);
  state.discoveryCooldown=190+Math.random()*120;
}

function finishDiscovery(){
  if(!discovery)return;
  state.resources.iron=(state.resources.iron||0)+260;
  state.resources.science=(state.resources.science||0)+420;
  state.scienceTotal+=420;
  state.productionTotal+=260;
  addLog('⛏ 掘削中に鉱石と古い知識片が発見されました。鉄+260、科学+420。');
  showBanner('DISCOVERY','大発見','鉱石と古い知識片が回収されました。',1700);
  showModal('⛏ 地下遺物を発見',`採掘中の住民が地下から特殊な鉱石と古い知識片を見つけました。<br><br><b>鉄 +260</b><br><b>科学 +420</b>`);
  effectGroup.remove(discovery.rig.group,discovery.hole,discovery.ore);
  camera.position.copy(discovery.originPos);controls.target.copy(discovery.originTarget);camera.zoom=discovery.originZoom;camera.updateProjectionMatrix();controls.enabled=true;discovery=null;
  renderAll();
}

function animateDiscovery(dt){
  if(!discovery)return;
  discovery.t+=dt;
  if(discovery.phase==='zoom'){
    const k=Math.min(1,discovery.t/.65);const e=k*k*(3-2*k);
    camera.position.lerpVectors(discovery.originPos,new THREE.Vector3(discovery.x+12,18,discovery.z+14),e);
    controls.target.lerpVectors(discovery.originTarget,new THREE.Vector3(discovery.x,0,discovery.z),e);
    camera.zoom=discovery.originZoom+(2.0-discovery.originZoom)*e;camera.updateProjectionMatrix();
    if(k>=1){discovery.phase='dig';discovery.t=0;}
  }else if(discovery.phase==='dig'){
    discovery.rig.pick.rotation.z=-.95+Math.sin(discovery.t*6.5)*.7;
    discovery.rig.group.position.y=.50+Math.abs(Math.sin(discovery.t*3))*0.04;
    discovery.ore.rotation.y+=dt*2.4;
    if(discovery.t>2.8){discovery.phase='reveal';discovery.t=0;}
  }else if(discovery.phase==='reveal'){
    const k=Math.min(1,discovery.t/.55);discovery.ore.scale.setScalar(.25+k*1.7);discovery.ore.position.y=.50+k*.55;discovery.ore.material.emissiveIntensity=.1+k*1.1;
    if(discovery.t>.9)finishDiscovery();
  }
}

/* =========================================================
   PRODUCTION
========================================================= */

function rates(){

  const out={
    food:0,
    wood:0,
    stone:0,
    iron:0,
    gold:0,
    science:0,
    culture:0
  };


  const eraMult=
    ERA[state.era].mult;


  for(
    const d of DISTRICTS
  ){

    const data=
      state.districts[d.id];


    if(
      data.level<=0 ||
      state.era<d.unlock
    )
      continue;


    const lvl=
      data.level;


    const workers=
      state.workers[d.id]||0;


    const workerMul=
      1+
      workers*.08;


    for(
      const [k,v]
        of Object.entries(
          d.base
        )
    ){

      out[k]+=
        v*
        lvl*
        workerMul*
        eraMult;

    }

  }


  /* 建設した設備による生産・都市効果 */
  for(const f of state.facilities){
    const def=facilityById(f.type);
    if(!def) continue;
    const lv=f.level||1;
    const mul=1+Math.max(0,lv-1)*.15;
    for(const [k,v] of Object.entries(def.effects||{})){
      if(['happiness','popMax','migration','storage','production'].includes(k)) continue;
      out[k]=(out[k]||0)+v*mul;
    }
  }

  /* Food upkeep */

  out.food -=
    state.pop*.19;


  /* Advanced bonuses */

  out.science *=
    1+
    state.era*.045;


  out.culture *=
    1+
    state.era*.035;

  out.gold *= 1 + (state.seaClaims||0)*.008;


  out.food *=
    Math.max(
      .35,
      state.happiness/100
    );

  const infra=1+(state.infrastructure-1)*.012;
  for(const k of ['food','wood','stone','iron','gold','science','culture']) out[k]*=infra;

  const policy={balanced:1,food:1.04,industry:1.05,science:1.06}[state.policy]||1;
  out.science*=state.policy==='science'?policy:1;
  out.food*=state.policy==='food'?policy:1;
  if(state.policy==='industry'){out.wood*=policy;out.stone*=policy;out.iron*=policy;out.gold*=policy;}

  return out;

}


/* =========================================================
   SIMULATION
========================================================= */

function simulate(sec){

  const r=
    rates();


  for(
    const k of Object.keys(r)
  ){

    state.resources[k]=
      (state.resources[k]||0)+
      r[k]*sec;


    if(k==='science'){

      state.scienceTotal +=
        Math.max(
          0,
          r[k]*sec
        );

    }


    if(k==='culture'){

      state.cultureTotal +=
        Math.max(
          0,
          r[k]*sec
        );

    }


    if(
      k!=='science' &&
      k!=='culture'
    ){

      state.productionTotal +=
        Math.max(
          0,
          r[k]*sec
        );

    }

  }


  /* 施設の人口容量・幸福度・インフラ効果 */
  let facilityHappy=0;
  let facilityPopMax=0;
  let facilityMigration=0;
  let facilityStorage=0;
  let facilityProduction=0;
  for(const f of state.facilities){
    const def=facilityById(f.type); if(!def) continue;
    const lv=f.level||1;
    facilityHappy += (def.effects?.happiness||0)*.008*lv;
    facilityPopMax += (def.effects?.popMax||0)*lv;
    facilityMigration += (def.effects?.migration||0)*lv;
    facilityStorage += (def.effects?.storage||0)*lv;
    facilityProduction += (def.effects?.production||0)*lv;
  }
  state.happiness=THREE.MathUtils.clamp(state.happiness+sec*facilityHappy,0,100);
  state.popMax=Math.max(1,state.popMax + sec*facilityPopMax*.0035);
  state.migration += sec*facilityMigration*.08;
  state.storage=Math.max(5000,state.storage+sec*facilityStorage*.00025);
  state.productionTotal += sec*facilityProduction*.2;

  /* Population */

  if(
    r.food>=0 &&
    state.pop<state.popMax
  ){

    const h=getHousingState();
    const room=h.capacity>state.pop?1:.25;
    const growth=.0105+state.happiness*.00008+state.infrastructure*.0005+state.migration*.00022;
    state.pop += sec*growth*room;


    state.pop=
      Math.min(
        state.popMax,
        state.pop
      );

  }


  /* Starvation */

  if(
    r.food<0
  ){

    state.happiness -=
      sec*.02;


    state.pop -=
      Math.min(
        sec*.02,
        Math.abs(r.food)*
        sec*.00015
      );


    state.pop=
      Math.max(
        1,
        state.pop
      );

  }
  else{

    state.happiness +=
      sec*.008;

  }


  state.happiness=
    THREE.MathUtils.clamp(
      state.happiness,
      0,
      100
    );


  state.year +=
    sec/7;

  state.worldTime=(state.worldTime||0)+sec;
  state.discoveryCooldown=Math.max(0,(state.discoveryCooldown||0)-sec);
  state.cityReach=Math.min(state.mapRadius-3,Math.max(state.cityReach,16+Math.sqrt(Math.max(0,state.pop))*0.72+state.mapExpansion*4));
  if(state.pop>25 && state.discoveryCooldown<=0 && Math.random()<sec*.0022){
    triggerDiscovery();
  }


  state.nextEvent -=
    sec;


  /* Capacity */

  for(
    const k of Object.keys(
      state.resources
    )
  ){

    state.resources[k]=
      Math.max(
        0,
        Math.min(
          state.storage,
          state.resources[k]
        )
      );

  }


  if(
    state.nextEvent<=0
  ){

    state.nextEvent=
      75+
      Math.random()*
      95;


    randomEvent();

  }

  simulateExpeditions(sec);

}


/* =========================================================
   EVOLUTION
========================================================= */

function districtThreshold(){

  const active=
    Object
      .values(state.districts)
      .filter(
        x=>x.level>0
      )
      .length;


  return active >=
    Math.min(
      3+
      Math.floor(
        state.era/2
      ),
      DISTRICTS.length
    );

}


function canEvolve(){

  if(
    state.era>=
    ERA.length-1
  )
    return false;


  const next=
    ERA[state.era+1];


  return (
    state.pop>=next.popNeed &&
    (Number(state.resources.science)||0)>=next.scienceNeed &&
    districtThreshold()
  );

}


function evolve(){

  if(!canEvolve()){

    toast(
      '次の時代の条件がまだ足りません'
    );

    return;

  }


  const oldEra=state.era;
  state.era++;


  state.happiness=
    Math.min(
      100,
      state.happiness+7
    );


  state.popMax +=
    10+
    state.era*5;


  state.storage +=
    3000;


  addLog(
    `文明が「${ERA[state.era].name}」へ進化しました。`
  );


  startEraTransition(oldEra,state.era);
  renderAll();


  showModal(

    `${ERA[state.era].name}へ進化`,

    `${ERA[state.era].desc}
    <br><br>
    都市の見た目と生産効率が変化しました。
    新しい地区も順次解禁されます。`

  );

}

          return `<button class="secondary" title="${formatCost(c)}" onclick="startBuildFacility('${f.id}')" ${ok?'':'disabled'}>${f.icon} ${f.name}<br><small style="opacity:.62">${formatCost(c)}</small></button>`;
        }).join('')}
      </div>
      <div class="action-row" style="margin-top:7px">
        <button class="secondary" onclick="expandMap()">🗺 領土を拡張</button>
        <button class="secondary" onclick="publicWorks()">🛠 公共事業</button>
      </div>
      <div class="action-row" style="margin-top:7px">
        <button class="secondary" onclick="cyclePolicy()">⚙️ 都市政策</button>
        <button class="secondary" onclick="holdFestival()">🎉 祭りを開催</button>
      </div>
      <div class="action-row" style="margin-top:7px">
        <button class="secondary" onclick="startDispatch('forest')">🌲 伐採隊</button>
        <button class="secondary" onclick="startDispatch('sea')">⚓ 海洋隊</button>
      </div>
      ${dispatchMode ? `<button class="secondary" style="margin-top:7px" onclick="cancelDispatch()">✕ 派遣モード解除</button>` : ''}
      ${buildMode ? `<button class="secondary" style="margin-top:7px" onclick="cancelBuildMode()">✕ 建設モード解除（${facilityById(buildMode)?.name||''}）</button>` : ''}
      <div class="muted" style="font-size:9px;margin-top:8px">設備 ${state.facilities.length}件　/　領土Lv.${state.mapExpansion}　/　海域 ${state.seaClaims||0}　/　制海力 ${state.oceanPower||0}</div>
      <div class="muted" style="font-size:9px;margin-top:4px">派遣中 ${state.expeditions.length}隊　/　森林開発 ${state.forestClears.length}区画</div>
    </div>

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          文明の次段階
        </div>

        <div class="muted"
             style="font-size:9px">

          ${
            nextEra
              ? nextEra.name
              : 'MAX'
          }

        </div>

      </div>


      ${
        nextEra

          ?

          `

          <div class="muted"
               style="
                 font-size:10px;
                 line-height:1.6
               ">

            人口
            ${fmt(state.pop)}
            /
            ${fmt(nextEra.popNeed)}

            <br>

            科学
            ${fmt(state.resources.science)}
            /
            ${fmt(nextEra.scienceNeed)}

            <br>

            地区開発
            ${
              districtThreshold()
                ? '達成'
                : '不足'
            }

          </div>


          <button
            class="primary"
            style="margin-top:9px"
            onclick="evolve()"
            ${
              ready
                ? ''
                : 'disabled'
            }>

            ${
              ready
                ? '🌄 次の時代へ進む'
                : 'まだ進化できない'
            }

          </button>

          `

          :

          `

          <div style="
            font-size:12px;
            font-weight:1000;
            color:#e9c878
          ">

            文明の最高段階に到達しました。

          </div>

          `
      }

    </div>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function renderAll(){

  renderSide();


  const r=
    rates();


  const resKeys=[
    'food',
    'wood',
    'stone',
    'iron',
    'gold',
    'science'
  ];


  for(
    const k of resKeys
  ){

    document.getElementById(
      k
    ).textContent=
      fmt(
        state.resources[k]
      );


    document.getElementById(
      k+'Rate'
    ).textContent=
      (
        r[k]>=0
          ? '+'
          : ''
      )+
      fmt(r[k])+
      '/s';

  }


  document.getElementById(
    'year'
  ).textContent=
    Math.floor(
      state.year
    )
    .toLocaleString();


  document.getElementById(
    'eraPill'
  ).textContent=
    ERA[state.era].name;


  document.getElementById(
    'brandSub'
  ).textContent=
    ERA[state.era].desc;


  document.getElementById(
    'hudPop'
  ).textContent=
    `${fmt(state.pop)} / ${fmt(state.popMax)}`;


  document.getElementById(
    'hudHappy'
  ).textContent=
    Math.floor(
      state.happiness
    )+'%';


  document.getElementById(
    'hudCity'
  ).textContent=
    `${ERA[state.era].label}・領土Lv.${state.mapExpansion}・海${state.seaClaims||0}`;

}


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGameSilent(){
  state.last=Date.now();
  localStorage.setItem('civilization_city_idle',JSON.stringify(state));
}

function saveGame(){
  saveGameSilent();
  toast('セーブしました');
}

window.saveGame=saveGame;


function loadGame(){

  const raw=
    localStorage.getItem(
      'civilization_city_idle'
    );


  if(!raw)
    return;


  try{

    const saved=
      JSON.parse(raw);


    Object.assign(
      state,
      saved
    );


    state.districts=
      Object.assign(
        {},
        state.districts,
        saved.districts||{}
      );

    state.mapRadius=Math.max(36,Math.min(100000,Number(saved.mapRadius)||44));
    state.mapExpansion=Math.max(0,Number(saved.mapExpansion)||0);
    state.cityReach=Math.max(12,Number(saved.cityReach)||16);
    state.facilities=Array.isArray(saved.facilities)?saved.facilities:[];
    state.infrastructure=Math.max(1,Number(saved.infrastructure)||1);
    state.housingBonus=Math.max(0,Number(saved.housingBonus)||0);
    state.migration=Math.max(0,Number(saved.migration)||0);
    state.festivals=Math.max(0,Number(saved.festivals)||0);
    state.policy=saved.policy||'balanced';
    state.worldTime=Math.max(0,Number(saved.worldTime)||0);
    state.discoveryCooldown=Math.max(0,Number(saved.discoveryCooldown)||100);
    state.worldSeed=Number(saved.worldSeed)||417203;
    state.seaClaims=Math.max(0,Number(saved.seaClaims)||0);
    state.oceanPower=Math.max(0,Number(saved.oceanPower)||0);
    state.forestClears=Array.isArray(saved.forestClears)?saved.forestClears:[];
    state.expeditions=Array.isArray(saved.expeditions)?saved.expeditions:[];
    state.roadsBuilt=Math.max(0,Number(saved.roadsBuilt)||0);
    state.wonders=Math.max(0,Number(saved.wonders)||0);

    /* 過去セーブの科学値が表示値とズレていた場合を救済 */
    state.resources.science=Math.max(0,Number(state.resources.science)||0);
    state.resources.iron=Math.max(0,Number(state.resources.iron)||0);


    for(
      const d of DISTRICTS
    ){

      state.districts[d.id]=
        Object.assign(
          {
            level:0
          },
          state.districts[d.id]||{}
        );

    }


    const elapsed=
      Math.min(
        60*60*1000,
        (
          Date.now()-
          (
            saved.last||
            Date.now()
          )
        )/1000
      );


    if(elapsed>20){

      simulate(
        elapsed
      );


      showModal(
        '🌙 おかえりなさい',

        `不在中の
        <b>${fmt(elapsed/60)}</b>
        分間、都市が発展しました。`

      );

    }


    state.last=
      Date.now();

  }
  catch(e){

    console.warn(
      e
    );

  }

}


function resetGame(){

  if(
    !confirm(
      '文明を最初からやり直しますか？'
    )
  )
    return;


  localStorage.removeItem(
    'civilization_city_idle'
  );


  location.reload();

}


window.resetGame=
  resetGame;


/* =========================================================
   LOG
========================================================= */

function addLog(text){

  state.logs.unshift(
    text
  );


  state.logs=
    state.logs.slice(
      0,
      40
    );

}


/* =========================================================
   MAP CLICK
========================================================= */

renderer.domElement
  .addEventListener(
    'pointerdown',
    e=>{

      pointerDown={
        x:e.clientX,
        y:e.clientY,
        t:performance.now()
      };

    }
  );


renderer.domElement
  .addEventListener(
    'pointerup',
    e=>{

      const dx=
        e.clientX-
        pointerDown.x;


      const dy=
        e.clientY-
        pointerDown.y;


      const dt=
        performance.now()-
        pointerDown.t;


      /*
        過度なドラッグをクリック扱いしない
      */

      if(
        Math.hypot(dx,dy)>8 ||
        dt>500
      )
        return;


      const rect=
        renderer.domElement
          .getBoundingClientRect();


      pointer.x=
        (
          (
            e.clientX-
            rect.left
          )/
          rect.width
        )*2-1;


      pointer.y=
        -(
          (
            e.clientY-
            rect.top
          )/
          rect.height
        )*2+1;


      raycaster.setFromCamera(
        pointer,
        camera
      );

      if(dispatchMode){
        const nodeHits=raycaster.intersectObjects(worldNodeObjects,true);
        if(nodeHits.length){
          let q=nodeHits[0].object;
          while(q && !q.userData.worldNode) q=q.parent;
          const node=q&&q.userData.worldNode;
          if(node && ((dispatchMode==='forest'&&node.type==='forest')||(dispatchMode==='sea'&&node.type==='sea'))){
            beginDispatch(dispatchMode,node.x,node.z,node.id);
            return;
          }
        }
        toast(dispatchMode==='forest'?'森林マークをタップしてください':'海のマークをタップしてください');
        return;
      }

      if(buildMode){
        const hit=raycaster.ray.intersectPlane(buildPlane,new THREE.Vector3());
        if(hit){placeFacilityAt(hit.x,hit.z);return;}
      }


      const hits=
        raycaster.intersectObjects(
          Array.from(
            districtObjects.values()
          ),
          true
        );


      if(!hits.length)
        return;


      let o=
        hits[0].object;


      let id=null;


      while(o){

        if(
          o.userData &&
          o.userData.districtId
        ){

          id=
            o.userData.districtId;

          break;

        }


        o=o.parent;

      }


      if(id)
        selectDistrict(
          id
        );

    }
  );


/* =========================================================
   RESIZE
========================================================= */

function resize(){
  const rect=mapEl.getBoundingClientRect();
  const w=Math.max(2,Math.round(rect.width));
  const h=Math.max(2,Math.round(rect.height));
  const aspect=w/Math.max(1,h),viewH=44,viewW=viewH*aspect;
  camera.left=-viewW/2;camera.right=viewW/2;camera.top=viewH/2;camera.bottom=-viewH/2;
  camera.near=.1;camera.far=500;camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
window.addEventListener('resize',resize,{passive:true});
if('ResizeObserver' in window){const ro=new ResizeObserver(()=>resize());ro.observe(mapEl);}

/* =========================================================
   START
========================================================= */

resize();
loadGame();
rebuildMap();
rebuildWorldChunks(true);
renderAll();
resize();
renderer.clear();renderer.render(scene,camera);

let last=performance.now();
let saveTick=0;
let renderTick=0;

function animateExpeditions(dt,t){
  while(expeditionObjects.length<state.expeditions.length){
    const e=state.expeditions[expeditionObjects.length];
    const g=makeExpeditionVisual(e);
    g.userData.expeditionId=e.id;
    effectGroup.add(g);expeditionObjects.push(g);
  }
  for(let i=expeditionObjects.length-1;i>=0;i--){
    const g=expeditionObjects[i];
    if(!state.expeditions.some(e=>e.id===g.userData.expeditionId)){
      effectGroup.remove(g);expeditionObjects.splice(i,1);
      continue;
    }
    const e=state.expeditions.find(x=>x.id===g.userData.expeditionId);
    if(!e)continue;
    const progress=Math.max(0,Math.min(1,1-e.remaining/e.duration));
    const outbound=progress<.5;
    const k=outbound?progress*2:(1-progress)*2;
    const start=new THREE.Vector3(0,.42,0);
    /* 出発地点は都心付近。遠征先へ移動して戻る。 */
    const sx=0,sz=0;
    const ex=e.x,ez=e.z;
    g.position.set(
      THREE.MathUtils.lerp(sx,ex,outbound?k:1-k),
      .46+Math.sin(t*.006+i)*.025,
      THREE.MathUtils.lerp(sz,ez,outbound?k:1-k)
    );
    if(e.type==='sea') g.rotation.y=Math.atan2(ez-sz,ex-sx);
    else g.rotation.y=Math.atan2(ez-sz,ex-sx);
  }
}

function updateWorldMood(dt,t){
  const cycle=(state.worldTime%140)/140;
  const sunAngle=cycle*Math.PI*2;
  sun.position.set(Math.cos(sunAngle)*45,28+Math.sin(sunAngle)*25,24);
  const daylight=Math.max(.20,.55+Math.sin(sunAngle)*.45);
  sun.intensity=1.65+daylight*1.35;
  ambient.intensity=.22+daylight*.32;
  hemi.intensity=1.2+daylight*.85;

  for(const q of smokePuffs){
    q.life+=dt*q.speed;
    if(q.life>2.5){q.life=0;q.mesh.position.set(q.baseX,.55,q.baseZ);}
    q.mesh.position.y+=dt*q.speed;
    q.mesh.position.x=q.baseX+Math.sin(q.life*1.8+q.phase)*.08;
    q.mesh.position.z=q.baseZ+Math.cos(q.life*1.3+q.phase)*.05;
    q.mesh.scale.setScalar(1+q.life*.55);
    q.mesh.material.opacity=.18*Math.max(0,1-q.life/2.5);
  }

  animateCitizens(dt,t);
  animateDiscovery(dt);
  animateExpeditions(dt,t);

  /* 水面の反射感をゆっくり変える */
  cityPulse+=dt;
  for(const f of facilityObjects){
    if(f.userData.facilityType==='power'||f.userData.facilityType==='research'||f.userData.facilityType==='habitat'){
      f.position.y=.01+Math.sin(t*.002+f.position.x)*.018;
      f.rotation.y+=dt*.05;
    }
  }
}

function loop(t){
  const dt=Math.min(1,(t-last)/1000);last=t;
  simulate(dt);
  updateWorldMood(dt,t);

  saveTick+=dt;renderTick+=dt;
  if(saveTick>=120){
    state.last=Date.now();
    localStorage.setItem('civilization_city_idle',JSON.stringify(state));
    saveTick=0;
  }
  if(renderTick>.35){
    const hc=getHousingState().houses;
    if(window.__lastHouseCount!==hc){buildResidentialCity(eraPalette());rebuildCitizenAgents();window.__lastHouseCount=hc;}
    renderAll();renderTick=0;
  }

  controls.update();
  rebuildWorldChunks(false);
  renderer.clear();renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
