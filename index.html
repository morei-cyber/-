<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>文明都市放置記</title>
<style>
:root{
  --bg:#080b12;
  --panel:rgba(17,21,30,.9);
  --panel2:rgba(23,28,39,.92);
  --line:rgba(255,255,255,.09);
  --text:#f7f2e9;
  --muted:#9ca4b4;
  --gold:#e9be68;
  --green:#75d79a;
  --red:#e77b7b;
  --blue:#7ebaf1;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  overflow:hidden
}

button{
  font:inherit
}

#app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:64px 1fr 72px;
  background:
    radial-gradient(
      circle at 50% 25%,
      #17212b 0,
      #0b1119 40%,
      #070a10 100%
    )
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:rgba(7,9,14,.88);
  backdrop-filter:blur(18px);
  z-index:30
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0
}

.brand-mark{
  width:35px;
  height:35px;
  border-radius:11px;
  background:
    linear-gradient(
      145deg,
      #eed48e,
      #b57c34
    );
  display:grid;
  place-items:center;
  color:#17120a;
  font-weight:1000;
  box-shadow:
    0 6px 24px rgba(226,169,77,.2)
}

.brand-name{
  font-weight:1000;
  letter-spacing:.03em;
  font-size:16px
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:2px
}

.top-right{
  display:flex;
  align-items:center;
  gap:9px
}

.era-pill{
  padding:8px 11px;
  border:1px solid rgba(233,190,104,.25);
  border-radius:12px;
  background:rgba(233,190,104,.07);
  font-size:11px;
  font-weight:900;
  color:#f1ce83
}

.year{
  font-size:12px;
  color:#c1c7d2
}

.year b{
  color:#fff
}


/* =============================
   MAIN
============================= */

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  min-height:0;
  gap:0
}


/* =============================
   MAP
============================= */

.map-shell{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(
      #13202b,
      #091118
    )
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-width:1px;
  min-height:1px;
  touch-action:none;
  overflow:hidden;
  isolation:isolate;
  background:#a9c8d7;
}

#map canvas{
  position:absolute;
  inset:0;
  display:block;
  width:100% !important;
  height:100% !important;
  z-index:0;
  opacity:1;
}

.map-vignette{
  pointer-events:none;
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 45% 45%,
      transparent 42%,
      rgba(2,4,8,.16) 100%
    )
}

.map-hud{
  position:absolute;
  left:16px;
  top:16px;
  display:flex;
  gap:8px;
  pointer-events:none
}

.hud-card{
  background:rgba(10,14,20,.72);
  border:1px solid var(--line);
  border-radius:13px;
  padding:9px 11px;
  backdrop-filter:blur(12px)
}

.hud-label{
  font-size:9px;
  color:var(--muted)
}

.hud-value{
  font-size:14px;
  font-weight:1000;
  margin-top:2px
}

.map-help{
  position:absolute;
  left:16px;
  bottom:16px;
  background:rgba(10,14,20,.65);
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:10px;
  color:#9ea6b3;
  font-size:10px;
  pointer-events:none
}

.map-help b{
  color:#eee
}


/* =============================
   SIDE PANEL
============================= */

.side{
  min-height:0;
  border-left:1px solid var(--line);
  background:rgba(10,13,19,.94);
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  overflow:hidden
}

.side-header{
  padding:17px;
  border-bottom:1px solid var(--line)
}

.side-kicker{
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em
}

.side-title{
  font-size:24px;
  font-weight:1000;
  margin-top:3px
}

.side-desc{
  color:#a7aebc;
  font-size:11px;
  line-height:1.55;
  margin-top:5px
}

.side-body{
  min-height:0;
  overflow:auto;
  padding:14px
}

.section{
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.022);
  margin-bottom:11px
}

.section:last-child{
  margin-bottom:0
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:9px
}

.section-title{
  font-size:11px;
  font-weight:1000;
  color:#e8e2d7
}

.muted{
  color:var(--muted)
}

.big-level{
  font-size:27px;
  font-weight:1000
}

.level-row{
  display:flex;
  align-items:end;
  justify-content:space-between
}

.bar{
  height:7px;
  background:#0b0e15;
  border:1px solid rgba(255,255,255,.06);
  border-radius:999px;
  overflow:hidden;
  margin-top:8px
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      #6b8ee8,
      #e8bd66
    );
  transition:width .3s
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.mini-stat{
  background:rgba(0,0,0,.18);
  border-radius:10px;
  padding:9px
}

.mini-label{
  font-size:9px;
  color:var(--muted)
}

.mini-value{
  font-weight:1000;
  font-size:15px;
  margin-top:2px
}

.prod{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px
}

.prod div{
  font-size:10px;
  color:#aeb4bf;
  background:rgba(0,0,0,.15);
  padding:6px 7px;
  border-radius:8px
}

.prod b{
  color:#eff3f7
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:11px;
  background:
    linear-gradient(
      135deg,
      #e9bd69,
      #b87935
    );
  color:#171106;
  font-weight:1000;
  cursor:pointer;
  box-shadow:
    0 9px 25px rgba(211,147,62,.16)
}

.primary:disabled{
  opacity:.35;
  cursor:not-allowed;
  box-shadow:none
}

.secondary{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
  background:#151a24;
  color:#e8ecf1;
  font-weight:900;
  cursor:pointer
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.side-footer{
  padding:12px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.footer-btn{
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#131821;
  color:#cfd5df;
  font-size:10px;
  font-weight:900;
  cursor:pointer
}


/* =============================
   RESOURCE BAR
============================= */

.bottom{
  display:grid;
  grid-template-columns:
    1.4fr
    1fr
    1fr
    1fr
    1fr
    1fr;

  gap:7px;
  padding:9px 12px;
  border-top:1px solid var(--line);
  background:rgba(7,9,14,.94);
  z-index:20
}

.res{
  min-width:0;
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.018)
}

.res-name{
  font-size:9px;
  color:var(--muted);
  white-space:nowrap
}

.res-val{
  font-size:14px;
  font-weight:1000;
  margin-top:1px;
  white-space:nowrap
}

.res-rate{
  font-size:9px;
  color:var(--green);
  white-space:nowrap
}


/* =============================
   MODAL
============================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(3,5,9,.76);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:18px
}

.overlay.show{
  display:flex
}

.modal{
  width:min(460px,100%);
  border:1px solid var(--line);
  border-radius:19px;
  background:#111722;
  padding:20px;
  box-shadow:0 25px 90px rgba(0,0,0,.55)
}

.modal h2{
  margin:0;
  font-size:22px
}

.modal p{
  font-size:12px;
  color:#b9bfca;
  line-height:1.7
}

.modal .modal-actions{
  display:flex;
  gap:8px;
  margin-top:15px
}


/* =============================
   TOAST
============================= */

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:120;
  background:rgba(11,15,22,.96);
  border:1px solid var(--line);
  padding:10px 13px;
  border-radius:11px;
  font-size:11px;
  transition:.22s;
  box-shadow:0 15px 35px rgba(0,0,0,.3)
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1
}


/* =============================
   TABLET
============================= */

@media(max-width:980px){

  #app{
    grid-template-rows:58px 1fr auto
  }

  .main{
    grid-template-columns:1fr
  }

  .side{
    position:absolute;
    z-index:25;
    right:10px;
    top:10px;
    bottom:10px;
    width:min(360px,calc(100vw - 20px));
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
    transform:
      translateX(
        calc(100% + 18px)
      );
    transition:.25s
  }

  .side.open{
    transform:translateX(0)
  }

  .bottom{
    position:relative;
    grid-template-columns:
      repeat(6,1fr);
    gap:5px;
    padding:7px
  }

  .res{
    padding:6px
  }

  .res-name{
    font-size:8px
  }

  .res-val{
    font-size:12px
  }

  .res-rate{
    font-size:8px
  }

  .map-help{
    bottom:12px;
    left:12px
  }

  .map-hud{
    top:12px;
    left:12px
  }

  .year{
    display:none
  }
}


/* =============================
   PHONE
============================= */

@media(max-width:620px){

  .topbar{
    padding:0 10px
  }

  .brand-name{
    font-size:14px
  }

  .brand-sub{
    font-size:8px
  }

  .era-pill{
    font-size:10px;
    padding:7px 8px
  }

  .bottom{
    grid-template-columns:
      repeat(3,1fr);
    grid-auto-rows:48px;
    overflow:auto
  }

  .res{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    column-gap:5px
  }

  .res-name{
    grid-column:1
  }

  .res-val{
    grid-column:2;
    grid-row:1
  }

  .res-rate{
    grid-column:1 / -1
  }

  .map-hud{
    gap:5px
  }

  .hud-card{
    padding:7px 8px
  }

  .hud-card:nth-child(3){
    display:none
  }
}

</style>
</head>

<div id="app">

        </button>

                onclick="resetGame()">
          ↻ リセット
        </button>

      </div>

    </aside>

  </main>


  <!-- RESOURCE BAR -->
  <footer class="bottom">

    <div class="res">

      <div class="res-name">
        🍖 食料
      </div>

      <div class="res-val"
           id="food">
        0
      </div>

      <div class="res-rate"
           id="foodRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        🌲 木材
      </div>

      <div class="res-val"
           id="wood">
        0
      </div>

      <div class="res-rate"
           id="woodRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        🪨 石材
      </div>

      <div class="res-val"
           id="stone">
        0
      </div>

      <div class="res-rate"
           id="stoneRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        ⛓ 鉄
      </div>

      <div class="res-val"
           id="iron">
        0
      </div>

      <div class="res-rate"
           id="ironRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        💰 金
      </div>

      <div class="res-val"
           id="gold">
        0
      </div>

      <div class="res-rate"
           id="goldRate">
        +0/s
      </div>

    </div>


    <div class="res">

      <div class="res-name">
        🔬 科学
      </div>

      <div class="res-val"
           id="science">
        0
      </div>

      <div class="res-rate"
           id="scienceRate">
        +0/s
      </div>

    </div>

  </footer>

</div>


<!-- MODAL -->
<div class="overlay"
     id="overlay">

  <div class="modal">

    <h2 id="modalTitle">
      文明
    </h2>

    <p id="modalText"></p>

    <div class="modal-actions">

      <button class="primary"
              onclick="closeModal()">
        OK
      </button>

    </div>

  </div>

</div>


<div class="toast"
     id="toast">
</div>

}

}

function fmt(n){

  if(!Number.isFinite(n))
    return '∞';

  if(Math.abs(n)<1000)
    return Math.floor(n)
      .toLocaleString('ja-JP');

  const units=[
    'K',
    'M',
    'B',
    'T',
    'Qa',
    'Qi'
  ];

  let x=n;
  let i=-1;

  while(
    Math.abs(x)>=1000 &&
    i<units.length-1
  ){

    x/=1000;
    i++;

  }

  if(x>=100)
    return x.toFixed(0)+units[i];

  if(x>=10)
    return x.toFixed(1)+units[i];

  return x.toFixed(2)+units[i];
}

/*
  道路の間に固定ロットを作る。
  ランダム配置ではないので、再描画しても
  家が別の場所へ飛ばない。
*/
function makeHouseLots(){

  const lots=[];

  const roadGap=6;
  const offsets=[-1.7,0,1.7];

  let id=0;

  for(
    let bx=-5;
    bx<=5;
    bx++
  ){

    for(
      let bz=-5;
      bz<=5;
      bz++
    ){

      const cx=bx*roadGap;
      const cz=bz*roadGap;

      for(
        const ox of offsets
      ){

        for(
          const oz of offsets
        ){

          const x=cx+ox;
          const z=cz+oz;

          /*
            水辺・大きな地区・中央広場と
            住宅が重ならないようにする。
          */
          if(
            x < -24.2 ||
            z > 26.4
          )
            continue;

          if(
            Math.hypot(x,z)<5.2
          )
            continue;

          let nearDistrict=false;

          for(
            const d of DISTRICTS
          ){

            const radius =
              d.id==='capital'
                ? 4.8
                : 3.8;

            if(
              Math.hypot(
                x-d.x,
                z-d.z
              ) < radius
            ){

              nearDistrict=true;
              break;

            }

          }

          if(nearDistrict)
            continue;

          lots.push({
            id:id++,
            x,
            z,
            dist:
              Math.hypot(x,z)
          });

        }

      }

    }

  }

  lots.sort(
    (a,b)=>
      a.dist-b.dist ||
      a.z-b.z ||
      a.x-b.x
  );

  return lots;

}


const HOUSE_LOTS =

function housingCapacityPerHouse(){
  return [4,4,6,6,8,15,24,40,80,180][state.era] || 4;
}

function getHousingState(){

  const population=Math.max(0,state.pop);
  const perHouse=housingCapacityPerHouse();
  const houses=Math.min(
    HOUSE_LOTS.length,
    Math.max(1,Math.ceil(population/perHouse))
  );

  return {
    population,
    houses,
    perHouse,
    capacity:houses*perHouse + state.housingBonus,
    shortage:Math.max(
      0,
      population-(HOUSE_LOTS.length*perHouse+state.housingBonus)
    )
  };

}

function addFence(parent,x,z,w,rotY=0){

  const fenceMat=
    new THREE.MeshStandardMaterial({
      color:0x806247,
      roughness:.9
    });

  const rail=new THREE.Mesh(
    new THREE.BoxGeometry(w,.08,.045),
    fenceMat
  );
  rail.position.set(x,.52,z);
  rail.rotation.y=rotY;
  parent.add(rail);

  const posts=Math.max(2,Math.round(w/0.38));
  for(let i=0;i<posts;i++){
    const t=new THREE.Mesh(
      new THREE.BoxGeometry(.05,.28,.05),
      fenceMat
    );
    const localX=
      -w/2 + (posts===1 ? 0 : i*(w/(posts-1)));
    t.position.set(x + localX*Math.cos(rotY), .64, z + localX*Math.sin(rotY));
    parent.add(t);
  }
}

function addRoadMarkings(parent){

  const era=state.era;
  if(era<3) return;

  const markMat=new THREE.MeshStandardMaterial({
    color:era>=6?0xd6d9d6:0xc1bca9,
    roughness:.86
  });
  const lineStep=era>=6?3.0:3.6;

  for(let i=-5;i<=5;i++){
    const x=i*6;
    for(let z=-28;z<=28;z+=lineStep){
      if(Math.abs(z)<2) continue;
      parent.add(box(.045,.014,.62,markMat,x,.205,z));
    }
  }

  for(let i=-5;i<=5;i++){
    const z=i*6;
    for(let x=-28;x<=28;x+=lineStep){
      if(Math.abs(x)<2) continue;
      parent.add(box(.62,.014,.045,markMat,x,.215,z));
    }
  }
}


function addRoadSideProps(parent){
  const era=state.era;
  if(era>=6) return;
  const shrubMat=mat(era<2?0x668353:0x59745a);
  for(let i=-4;i<=4;i++){
    const x=i*6+1.15;
    parent.add(cyl(.11,.22,shrubMat,x,.28,-2.45,7));
    parent.add(cyl(.10,.19,shrubMat,x+2.3,.27,2.45,7));
  }
}


function addModernStreetFurniture(parent){
  const era=state.era;
  if(era<6) return;
  const metal=mat(era>=8?0x4a6878:0x454b51,.45);
  for(let i=-4;i<=4;i+=2){
    const x=i*6+1.2;
    parent.add(cyl(.045,1.18,metal,x,.18,-2.45,7));
    const lightMat=new THREE.MeshStandardMaterial({color:0xc9f3ff,emissive:0x48c7ff,emissiveIntensity:era>=8?.8:.35,roughness:.25});
    parent.add(cyl(.09,.06,lightMat,x+0.04,1.42,-2.45,8));
  }
}


function buildHouse(
  lot,
  occupied,
  p
){

  const g=new THREE.Group();
  g.position.set(lot.x,0,lot.z);
  g.userData.houseId=lot.id;
  g.userData.occupied=occupied;
  g.userData.era=state.era;

  const era=state.era;
  const density=lot.dist<12 ? 1.08 : 1;

  const wallColors=[
    0xb99063,0xc39a6c,0xb9a07c,0x9c9186,0x968b82,
    0x777b80,0x6d7881,0x718b9c,0x7897aa,0x7f9eaf

  const roofColors=[
    p.roof,0x9b6845,0x8b5a49,0x684e58,0x6f4d57,
    0x48535d,0x425f70,0x426e88,0x4f7b9b,0x5c82a9
  ];

  const wall=new THREE.MeshStandardMaterial({
    color:wallColors[era], roughness:era>=7?.52:.82, metalness:era>=7?.08:0
  });
  const roof=new THREE.MeshStandardMaterial({
    color:roofColors[era], roughness:era>=6?.5:.76, metalness:era>=8?.12:0
  });
  const dark=new THREE.MeshStandardMaterial({color: p.trim, roughness:.72, metalness:era>=5?.25:0});
  const warm=new THREE.MeshStandardMaterial({
    color:0xffdf9a, emissive:0xffa52f,
    emissiveIntensity:occupied?(.18+era*.03):0, roughness:.25
  });

  /* 道路側の小さな区画 */
  const base=new THREE.Mesh(
    new THREE.BoxGeometry(1.58,0.10,1.28),
    new THREE.MeshStandardMaterial({
      color:era<3?0x806b53:era<6?0x737574:0x59636a,
      roughness:1
    })
  );
  base.position.y=.47;
  g.add(base);

  if(era===0){
    /* 原始：円形小屋＋焚き火 */
    const hut=new THREE.Mesh(
      new THREE.CylinderGeometry(.48,.55,.62,8),
      wall
    );
    hut.position.y=.78;
    g.add(hut);

    const roofTop=new THREE.Mesh(
      new THREE.ConeGeometry(.62,.52,8),
      roof
    );
    roofTop.position.y=1.34;
    g.add(roofTop);

    const fire=new THREE.Mesh(
      new THREE.ConeGeometry(.10,.28,5),
      warm
    );
    fire.position.set(.62,.58,.10);
    g.add(fire);
  }
  else if(era===1){
    /* 村：木組み住宅 */
    const body=box(1.18,.76,1.00,wall,0,.90,0);
    g.add(body);
    const roofTop=new THREE.Mesh(new THREE.ConeGeometry(.82,.56,4),roof);
    roofTop.rotation.y=Math.PI/4;
    roofTop.position.y=1.56;
    g.add(roofTop);
    for(const x of [-.42,.42]) g.add(box(.075,.78,.075,dark,x,.90,-.51));
    g.add(box(1.1,.075,.075,dark,0,1.20,-.51));
  }
  else if(era===2){
    /* 青銅：石壁＋瓦屋根 */
    const body=box(1.22,.88,1.02,wall,0,.98,0);
    g.add(body);
    const roofTop=new THREE.Mesh(new THREE.ConeGeometry(.84,.48,4),roof);
    roofTop.rotation.y=Math.PI/4;
    roofTop.position.y=1.66;
    g.add(roofTop);
    g.add(box(.22,.40,.04,dark,0,.73,-.53));
    for(const x of [-.34,.34]) addWindow(g,x,1.13,-.535,.19,.18,0x83a6ad);
  }
  else if(era===3){
    /* 鉄器：石造家＋煙突 */
    const body=box(1.26,1.00,1.04,wall,0,1.03,0);
    g.add(body);
    const roofTop=new THREE.Mesh(new THREE.ConeGeometry(.88,.56,6),roof);
    roofTop.position.y=1.81;
    g.add(roofTop);
    g.add(box(.18,.46,.18,dark,.34,1.68,.20));
    for(const x of [-.34,.34]) addWindow(g,x,1.18,-.545,.20,.21,0x87a5ad);
  }
  else if(era===4){
    /* 中世：屋根が急な長屋風住宅 */

    g.add(body);
    const roofTop=new THREE.Mesh(new THREE.ConeGeometry(.90,.78,4),roof);

    roofTop.position.y=2.06;

    g.add(box(.21,.48,.04,dark,0,.86,-.55));

  else if(era===5){

    addWindow(g,.32,1.28,-.56,.23,.20,0x7faab6);
    addWindow(g,-.32,1.73,-.56,.23,.20,0x7faab6);
    addWindow(g,.32,1.73,-.56,.23,.20,0x7faab6);

  else if(era===6){

    g.add(body);
    g.add(box(1.42,.10,1.18,roof,0,2.26,0));
    g.add(box(.22,.52,.04,dark,0,.88,-.57));
    for(const y of [1.35,1.85]){
      addWindow(g,-.35,y,-.57,.25,.22,p.glass);
      addWindow(g,.35,y,-.57,.25,.22,p.glass);
    }
    const pole=cyl(.035,1.55,dark,.76,.52,.30,6);
    const wire=box(.65,.02,.02,dark,.43,2.00,.30);
    g.add(pole,wire);
  }
  else if(era===7){
    /* 情報：集合住宅 */
    const body=box(1.44,2.18,1.12,wall,0,1.62,0);
    g.add(body);
    g.add(box(1.52,.10,1.20,roof,0,2.76,0));
    for(let row=0;row<3;row++){
      for(const x of [-.37,0,.37]){

      }
    }
    g.add(box(1.25,.055,.10,dark,0,1.02,-.63));
  }
  else if(era===8){

    const body=box(1.50,2.55,1.16,wall,0,1.82,0);
    g.add(body);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.78,.78,.12,8),roof);

    g.add(cap);
    for(let row=0;row<4;row++){

    }
    const edge=new THREE.MeshStandardMaterial({color:0x9be7ff,emissive:0x37b8ff,emissiveIntensity:.22,metalness:.65,roughness:.25});
    g.add(box(1.52,.045,.045,edge,0,.72,-.61));
    g.add(box(1.52,.045,.045,edge,0,3.48,-.61));

  /* 共通の庭・玄関・街路樹 */
  if(era<6){
    const yard=new THREE.Mesh(
      new THREE.BoxGeometry(1.54,.025,1.22),
      new THREE.MeshStandardMaterial({color:era<3?0x78945e:0x71846d,roughness:1})
    );
    yard.position.y=.525;
    g.add(yard);
  }

  const path=new THREE.Mesh(
    new THREE.BoxGeometry(.18,.028,.38),
    new THREE.MeshStandardMaterial({color:era<5?0xb4a184:0x8b9296,roughness:1})
  );

  g.add(path);

  /* 住民がいる家には生活感 */

    r.position.z=-.64 + (i*.16);
    r.position.x=-.28+(i*.22);
    r.position.y=.51;
    g.add(r);

      new THREE.BoxGeometry(.28,.10,.48),
      new THREE.MeshStandardMaterial({color:era>=7?0x466b80:0x5a5f63,metalness:.45,roughness:.45})
    );
    parked.position.set(.49,.59,.44);
    g.add(parked);
  }

  residentialGroup.add(g);
  houseObjects.push(g);

}


function buildResidentialCity(p){

  clearResidentialCity();

  if(residentialGroup.parent!==cityGroup){
    cityGroup.add(residentialGroup);
  }

  const housing=getHousingState();

  for(let i=0;i<housing.houses;i++){
    const lot=HOUSE_LOTS[i];
    if(!lot) break;

    const remaining=housing.population-i*housing.perHouse;
    const occupied=Math.max(0,Math.min(housing.perHouse,remaining));
    buildHouse(lot,occupied,p);
  }

}


function clearCitizenAgents(){
  while(citizenGroup.children.length){
    citizenGroup.remove(citizenGroup.children[0]);
  }
  citizenAgents.length=0;
}

function makeCitizenAgent(index,p){

  const g=new THREE.Group();
  const era=state.era;
  const palette=[0x3d6484,0x875b50,0x6d5f8e,0x6c7855,0x8b704e,0x4c6675,0x6b7a8f,0x4f7590,0x688ba0,0x6280a0];
  const shirt=new THREE.MeshStandardMaterial({color:palette[(index*7+era*3)%palette.length],roughness:.9});
  const skin=new THREE.MeshStandardMaterial({color:[0xe2ac84,0xc98e69,0xf0bd8f,0xb97659][index%4],roughness:.9});

  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.16,3,5),shirt);
  torso.position.y=.24;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.085,8,6),skin);
  head.position.y=.43;
  const leg1=box(.055,.18,.055,shirt,-.035,.095,0);
  const leg2=box(.055,.18,.055,shirt,.035,.095,0);
  g.add(torso,head,leg1,leg2);

  if(era>=5){
    const bag=box(.09,.11,.035,new THREE.MeshStandardMaterial({color:0x444a52,roughness:.8}),-.10,.30,.015);
    g.add(bag);
  }

  g.scale.setScalar(era>=7?1.15:1.0);
  g.userData.speed=.55+((index*13)%25)/100;
  g.userData.phase=(index*.73)%6.28;
  return g;
}

function buildCitizenAgents(){

  clearCitizenAgents();
  if(citizenGroup.parent!==cityGroup) cityGroup.add(citizenGroup);

  const housing=getHousingState();
  if(housing.houses<=0 || state.pop<=0) return;

  const count=Math.min(90,Math.max(0,Math.floor(state.pop)));
  const activeDistricts=DISTRICTS.filter(d=>state.era>=d.unlock && state.districts[d.id].level>0);

  for(let i=0;i<count;i++){
    const home=HOUSE_LOTS[i%housing.houses];
    const job=activeDistricts[i%Math.max(1,activeDistricts.length)] || DISTRICTS[0];
    const hx=home.x, hz=home.z;
    const roadX=Math.round(hx/6)*6;
    const roadZ=Math.round(hz/6)*6;
    const tx=job.x, tz=job.z;
    const points=[
      new THREE.Vector3(hx,.52,hz),
      new THREE.Vector3(roadX,.52,hz),
      new THREE.Vector3(roadX,.52,tz),
      new THREE.Vector3(tx,.52,tz),
      new THREE.Vector3(roadX,.52,tz),
      new THREE.Vector3(roadX,.52,hz),
      new THREE.Vector3(hx,.52,hz)
    ];

    const g=makeCitizenAgent(i);
    const startOffset=(i%7)/7;
    g.position.copy(points[0]);
    g.userData.points=points;
    g.userData.segment=Math.floor(startOffset*(points.length-1))%(points.length-1);
    g.userData.t=startOffset;
    g.userData.direction=1;
    g.userData.home=home.id;
    g.userData.job=job.id;
    citizenGroup.add(g);
    citizenAgents.push(g);
  }
}

function animateCitizenAgents(dt,t){
  for(const g of citizenAgents){
    const pts=g.userData.points;
    if(!pts || pts.length<2) continue;
    let a=g.userData.segment;
    let b=a+g.userData.direction;
    if(b<0) b=pts.length-1;
    if(b>=pts.length) b=0;

    const target=pts[b];
    const dir=new THREE.Vector3().subVectors(target,g.position);
    const dist=dir.length();
    const speed=g.userData.speed || .65;

    if(dist<.05){
      g.userData.segment=b;
    }else{
      dir.normalize();
      g.position.addScaledVector(dir,speed*dt);
      g.rotation.y=Math.atan2(dir.x,dir.z);
    }
    g.position.y=.52 + Math.sin(t*.004+g.userData.phase)*.012;
  }
}

function districtMat(d){

  const lookup={

    capital:0xb69b66,
    farm:0x7ba15c,
    wood:0x517b58,
    stone:0x8a8e8a,
    iron:0x6d6f74,
    market:0x9b774c,
    science:0x708da7,
    industry:0x616974,
    space:0x6f78a7

  };


  return mat(
    lookup[d.type] ||
    0x777777
  );

}


/* =========================================================
   BUILDING HEIGHT
========================================================= */

function buildingHeight(
  d,
  level
){

  const eraBoost=
    1+state.era*.12;


  if(d.type==='capital')
    return (
      1.8+
      level*.45
    )*eraBoost;


  if(d.type==='farm')
    return .7+
      level*.08;


  if(d.type==='wood')
    return .9+
      level*.1;


  if(d.type==='stone')
    return 1+
      level*.08;


  if(d.type==='iron')
    return 1.2+
      level*.13;


  if(d.type==='market')
    return 1.1+
      level*.18*
      eraBoost;


  if(d.type==='science')
    return 1.2+
      level*.22*
      eraBoost;


  if(d.type==='industry')
    return 1.5+
      level*.28*
      eraBoost;


  if(d.type==='space')
    return 1.8+
      level*.35*
      eraBoost;


  return 1;

}


/* =========================================================
   PEOPLE
========================================================= */

function addPeople(
  group,
  d
){

  const workers=
    state.workers[d.id] || 0;


  const n=
    Math.max(
      0,
      Math.min(
        8,
        Math.floor(
          workers/
          Math.max(
            1,
            Math.ceil(
              state.pop/120
            )
          )
        )+
        Math.min(
          3,
          state.districts[d.id].level
        )
      )
    );


  const body=
    mat(0xe9ded0);

  const head=
    mat(0xe7b98b);


  for(
    let i=0;
    i<n;
    i++
  ){

    const p=
      new THREE.Group();


    p.add(
      cyl(
        .11,
        .38,
        body,
        0,
        .19,
        0,
        6
      )
    );


    p.add(
      cyl(
        .13,
        .16,
        head,
        0,
        .48,
        0,
        6
      )
    );


    p.position.set(
      -1+
      i*.32,
      .02,
      .95+
      (i%2)*.25
    );


    group.add(
      p
    );

  }

}


/* =========================================================
   BUILD DISTRICT
========================================================= */

function buildDistrictVisual(
  d,
  p
){

  const data=
    state.districts[d.id];


  const lvl=
    Math.max(
      1,
      data.level
    );


  const group=
    new THREE.Group();


  group.position.set(
    d.x,
    0,
    d.z
  );


  group.userData.districtId=
    d.id;


  const padW=
    d.id==='capital'
      ? 7.2
      : 6.2;


  const padD=
    d.id==='capital'
      ? 6.1
      : 5.3;


  const pad=
    box(
      padW,
      .42,
      padD,
      districtMat(d),
      0,
      .21,
      0
    );


  pad.userData.districtId=
    d.id;


  group.add(
    pad
  );


  const rim=
    box(
      padW+.18,
      .12,
      padD+.18,
      mat(0x252c31),
      0,
      .05,
      0
    );


  rim.userData.districtId=
    d.id;


  group.add(
    rim
  );


  if(d.type==='farm'){

    drawFarm(
      group,
      lvl
    );

  }
  else if(d.type==='wood'){

    drawForest(
      group,
      lvl
    );

  }
  else if(d.type==='stone'){

    drawQuarry(
      group,
      lvl
    );

  }
  else if(d.type==='iron'){

    drawMine(
      group,
      lvl
    );

  }
  else{

    drawBuildings(
      group,
      d,
      lvl,
      p
    );

  }


  addPeople(
    group,
    d
  );


  return group;

}

function drawFarm(
  g,
  lvl
){

  const soil=
    mat(0x6d4c35);

  const crop=
    mat(0x86b85a);

  const hut=
    mat(0x90623f);


  const rows=
    Math.min(
      5,
      2+
      Math.floor(lvl/4)
    );


  for(
    let r=0;
    r<rows;
    r++
  ){

    const z=
      -1.8+
      r*.85;


    const bed=
      box(
        4.6,
        .08,
        .58,
        soil,
        0,
        .47,
        z
      );


    g.add(
      bed
    );


    for(
      let i=0;
      i<9;
      i++
    ){

      const c=
        cyl(
          .05,
          .32,
          crop,
          -2.05+
          i*.51,
          .56,
          z,
          5
        );

      g.add(
        c
      );

    }

  }


  for(
    let i=0;
    i<
      Math.min(
        1+
        Math.floor(lvl/3),
        4
      );
    i++
  ){

    const h=
      box(
        .9,
        .65,
        .8,
        hut,
        -1.9+
        i*1.25,
        .8,
        2
      );


    g.add(
      h
    );


    g.add(
      cyl(
        .12,
        .35,
        mat(0x5b4b43),
        -1.9+
        i*1.25,
        1.1,
        2,
        6
      )
    );

  }

}

function drawForest(

){

  const tm=

  const tr=

  const n=
    Math.min(
      18,
      6+
      lvl*2
    );


  for(
    let i=0;
    i<n;
    i++
  ){

    const x=
      -2.2+
      (i%6)*.88;

    const z=
      -1.6+
      Math.floor(i/6)*1.4;


    g.add(
      cyl(
        .15,
        .8,
        tr,
        x,
        .48,
        z,
        6
      )
    );


    g.add(
      cyl(
        .42,
        .9,
        tm,
        x,
        1.12,
        z,

      buildingHeight(
        d,

        .55+
        ((i%3)/5)
      );

      .78+
      ((i%2)*.12);


    const dep=
      .72+
      (((i+1)%2)*.12);

      box(
        w,
        h,
        dep,
        wall,
        x,
        .42+h/2,
        z
      );


    g.add(
      b
    );


    const r=
      box(
        w+.06,
        .18,
        dep+.06,
        roof,
        x,
        .42+h+.09,
        z

      r

        })

){

  if(!state.districts[id])

  const d=

    state.era<d.unlock &&

/* =========================================================
   COST
========================================================= */

function levelCost(d){

  const l=
    Math.max(
      1,
      state.districts[d.id].level
    );


  const base={

    food:120,
    wood:100,
    stone:70,
    iron:15,
    gold:30,
    science:10

  };


  const mul=
    Math.pow(
      d.growth,
      l-1
    );


  const cost={};


  for(
    const k in base
  ){

    cost[k]=
      base[k]*mul;

  }


  if(d.unlock>=3){

    cost.science*=
      1+
      d.unlock*.5;

  }


  return cost;

}


function canAfford(cost){

  return Object
    .entries(cost)
    .every(
      ([k,v])=>
        (state.resources[k]||0)>=v
    );

}


function pay(cost){

  for(
    const [k,v]
      of Object.entries(cost)
  ){

    state.resources[k]-=v;

  }

}


function formatCost(cost){

  return Object
    .entries(cost)
    .filter(([,v])=>v>0)
    .map(
      ([k,v])=>
        `${resourceIcon(k)} ${fmt(v)}`
    )
    .join('　');

}

   UPGRADE
========================================================= */

function upgradeSelected(){

  const d=
    DISTRICTS.find(
      x=>x.id===state.selected
    );


  if(!d)
    return;


  const data=
    state.districts[d.id];


  if(
    state.era<d.unlock
  ){

    toast(
      `${ERA[d.unlock].name}で解禁`
    );

    return;

  }


  if(
    d.id==='space' &&
    data.level===0
  ){

    data.level=1;

  }


  const cost=
    levelCost(d);


  if(!canAfford(cost)){

    toast(
      '資源が足りません'
    );

    return;

  }


  pay(cost);


  data.level++;


  state.popMax +=
    d.type==='capital'
      ? 5
      : 2;


  if(d.type==='capital'){

    state.happiness=
      Math.min(
        100,
        state.happiness+1
      );

  }


  state.productionTotal+=1;


  addLog(
    `${d.name}がレベル${data.level}になりました。`
  );


  rebuildMap();
  renderAll();


  toast(
    `${d.name}をLv.${data.level}へ強化`
  );

}

/* =========================================================
   PRODUCTION
========================================================= */

function rates(){

  const out={
    food:0,
    wood:0,
    stone:0,
    iron:0,
    gold:0,
    science:0,
    culture:0
  };


  const eraMult=
    ERA[state.era].mult;

  const policyMult={
    balanced:{food:1,wood:1,stone:1,iron:1,gold:1,science:1,culture:1},
    food:{food:1.28,wood:.90,stone:.92,iron:.90,gold:.92,science:.92,culture:1.02},
    industry:{food:.92,wood:1.10,stone:1.12,iron:1.24,gold:1.20,science:1.03,culture:.94},
    science:{food:.92,wood:.94,stone:.94,iron:.94,gold:.96,science:1.30,culture:1.15}
  }[state.policy] || null;


  for(
    const d of DISTRICTS
  ){

    const data=
      state.districts[d.id];


    if(
      data.level<=0 ||
      state.era<d.unlock
    )
      continue;


    const lvl=
      data.level;


    const workers=
      state.workers[d.id]||0;


    const workerMul=
      1+
      workers*.08;


    for(
      const [k,v]
        of Object.entries(
          d.base
        )
    ){

      out[k]+=
        v*
        lvl*
        workerMul*
        eraMult*
        (policyMult?.[k]||1);

    }

  }


  /* Food upkeep */

  out.food -=
    state.pop*.19;


  /* Advanced bonuses */

  out.science *=
    1+
    state.era*.045;


  out.culture *=
    1+
    state.era*.035;


  out.food *=
    Math.max(
      .35,
      state.happiness/100
    );


  return out;

}


/* =========================================================
   SIMULATION
========================================================= */

function simulate(sec){

  const r=
    rates();


  for(
    const k of Object.keys(r)
  ){

    state.resources[k]=
      (state.resources[k]||0)+
      r[k]*sec;


    if(k==='science'){

      state.scienceTotal +=
        Math.max(
          0,
          r[k]*sec
        );

    }


    if(k==='culture'){

      state.cultureTotal +=
        Math.max(
          0,
          r[k]*sec
        );

    }


    if(
      k!=='science' &&
      k!=='culture'
    ){

      state.productionTotal +=
        Math.max(
          0,
          r[k]*sec
        );

    }

  }


  /* Population */

  if(
    r.food>=0 &&
    state.pop<state.popMax
  ){

    const housing=getHousingState();
    const housingRoom=housing.capacity>state.pop ? 1 : .35;
    const growthBase=.010 + state.happiness*.00008 + state.infrastructure*.00055 + state.migration*.00045;
    state.pop += sec*growthBase*housingRoom;


    state.pop=
      Math.min(
        state.popMax,
        state.pop
      );

  }


  /* Starvation */

  if(
    r.food<0
  ){

    state.happiness -=
      sec*.02;


    state.pop -=
      Math.min(
        sec*.02,
        Math.abs(r.food)*
        sec*.00015
      );


    state.pop=
      Math.max(
        1,
        state.pop
      );

  }
  else{

    state.happiness +=
      sec*.008;

  }


  state.happiness=
    THREE.MathUtils.clamp(
      state.happiness,
      0,
      100
    );


  state.year +=
    sec/7;


  state.nextEvent -=
    sec;

  state.migration=Math.max(0,state.migration-sec*.00018);


  /* Capacity */

  for(
    const k of Object.keys(
      state.resources
    )
  ){

    state.resources[k]=
      Math.max(
        0,
        Math.min(
          state.storage,
          state.resources[k]
        )
      );

  }


  if(
    state.nextEvent<=0
  ){

    state.nextEvent=
      75+
      Math.random()*
      95;


    randomEvent();

  }

}

/* =========================================================
   EVOLUTION/* =========================================================
   EVOLUTION
========================================================= */

function districtThreshold(){

  const active=
    Object
      .values(state.districts)
      .filter(
        x=>x.level>0
      )
      .length;


  return active >=
    Math.min(
      3+
      Math.floor(
        state.era/2
      ),
      DISTRICTS.length
    );

}


function canEvolve(){

  if(
    state.era>=
    ERA.length-1
  )
    return false;


  const next=
    ERA[state.era+1];


  /*
    時代進行条件は、下部に表示している「科学」資源を
    そのまま判定に使う。
    以前は scienceTotal（累積研究量）を参照していたため、
    科学が500あっても scienceTotal が0の保存データでは
    ずっと条件未達になっていた。
  */
  const currentScience =
    Math.max(
      0,
      Number(state.resources.science) || 0
    );

  return (
    state.pop>=next.popNeed &&
    currentScience>=next.scienceNeed &&
    districtThreshold()
  );

}


function evolve(){

  if(!canEvolve()){

    toast(
      '次の時代の条件がまだ足りません'
    );

    return;

  }


  state.era++;


  state.happiness=
    Math.min(
      100,
      state.happiness+7
    );


  state.popMax +=
    10+
    state.era*5;


  state.storage +=
    3000;


  addLog(
    `文明が「${ERA[state.era].name}」へ進化しました。`
  );


  rebuildMap();
  renderAll();


  showModal(

    `${ERA[state.era].name}へ進化`,

    `${ERA[state.era].desc}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

  state.last=
    Date.now();


  localStorage.setItem(
    'civilization_city_idle',
    JSON.stringify(
      state
    )
  );


  toast(
    'セーブしました'
  );

}


window.saveGame=
  saveGame;


function loadGame(){

  const raw=
    localStorage.getItem(
      'civilization_city_idle'
    );


  if(!raw)
    return;


  try{

    const saved=
      JSON.parse(raw);


    Object.assign(
      state,
      saved
    );


    state.districts=
      Object.assign(
        {},
        state.districts,
        saved.districts||{}
      );


    state.infrastructure=Math.max(1,state.infrastructure||1);
    state.housingBonus=Math.max(0,state.housingBonus||0);
    state.migration=Math.max(0,state.migration||0);
    state.policy=state.policy||'balanced';
    state.festivals=Math.max(0,state.festivals||0);

    for(
      const d of DISTRICTS
    ){

      state.districts[d.id]=
        Object.assign(
          {
            level:0
          },
          state.districts[d.id]||{}
        );

    }


    const elapsed=
      Math.min(
        60*60*1000,
        (
          Date.now()-
          (
            saved.last||
            Date.now()
          )
        )/1000
      );


    if(elapsed>20){

      simulate(
        elapsed
      );


      showModal(
        '🌙 おかえりなさい',

        `不在中の
        <b>${fmt(elapsed/60)}</b>
        分間、都市が発展しました。<br><small>（最大1000時間までオフライン進行）</small>`

      );

    }


    state.last=
      Date.now();

  }
  catch(e){

    console.warn(
      e
    );

  }

}


function resetGame(){

  if(
    !confirm(
      '文明を最初からやり直しますか？'
    )
  )
    return;


  localStorage.removeItem(
    'civilization_city_idle'
  );


  location.reload();

}


window.resetGame=

/* =========================================================
   MAP CLICK
========================================================= */

renderer.domElement
  .addEventListener(
    'pointerdown',
    e=>{

      pointerDown={
        x:e.clientX,
        y:e.clientY,
        t:performance.now()
      };

    }
  );


renderer.domElement
  .addEventListener(
    'pointerup',
    e=>{

      const dx=
        e.clientX-
        pointerDown.x;


      const dy=
        e.clientY-
        pointerDown.y;


      const dt=
        performance.now()-
        pointerDown.t;


      /*
        過度なドラッグをクリック扱いしない
      */

      if(
        Math.hypot(dx,dy)>8 ||
        dt>500
      )
        return;


      const rect=
        renderer.domElement
          .getBoundingClientRect();


      pointer.x=
        (
          (
            e.clientX-
            rect.left
          )/
          rect.width
        )*2-1;


      pointer.y=
        -(
          (
            e.clientY-
            rect.top
          )/
          rect.height
        )*2+1;


      raycaster.setFromCamera(
        pointer,
        camera
      );


      const hits=
        raycaster.intersectObjects(
          Array.from(
            districtObjects.values()
          ),
          true
        );


      if(!hits.length)
        return;


      let o=
        hits[0].object;


      let id=null;


      while(o){

        if(
          o.userData &&
          o.userData.districtId
        ){

          id=
            o.userData.districtId;

          break;

        }


        o=o.parent;

      }


      if(id)
        selectDistrict(
          id
        );

    }
  );


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  const rect=
    mapEl.getBoundingClientRect();

  const w=
    Math.max(2, Math.round(rect.width));

  const h=
    Math.max(2, Math.round(rect.height));

  const aspect=
    w/Math.max(1,h);

  const viewH=
    40;

  const viewW=
    viewH*aspect;

  camera.left=-viewW/2;
  camera.right=viewW/2;
  camera.top=viewH/2;
  camera.bottom=-viewH/2;
  camera.near=0.1;
  camera.far=500;
  camera.updateProjectionMatrix();

  renderer.setSize(
    w,
    h,
    false
  );

  canvas.style.width=w+'px';
  canvas.style.height=h+'px';

  camera.lookAt(
    controls.target.x,
    controls.target.y,
    controls.target.z
  );

}

window.addEventListener(
  'resize',
  resize,
  {passive:true}
);

document.addEventListener('visibilitychange',()=>{
  if(document.hidden) saveGameSilent();
});
window.addEventListener('pagehide',saveGameSilent);

function saveGameSilent(){
  state.last=Date.now();
  localStorage.setItem('civilization_city_idle',JSON.stringify(state));
}


if('ResizeObserver' in window){
  const mapResizeObserver=
    new ResizeObserver(()=>resize());
  mapResizeObserver.observe(mapEl);
}

if(window.visualViewport){
  window.visualViewport.addEventListener(
    'resize',
    resize,
    {passive:true}
  );
}


/* 住宅再構築の前回値 */
let lastHouseCount = -1;


/* =========================================================
   START
========================================================= */

/* JSFiddle/iPadではレイアウト確定前に script が実行される場合がある。
   初期化→再構築→2フレーム後の resize/render の順で確実に描画する。 */
resize();

loadGame();

rebuildMap();

lastHouseCount=
  getHousingState().houses;

renderAll();

controls.target.set(0,0,0);
controls.update();
resize();
renderer.clear();
renderer.render(scene,camera);

requestAnimationFrame(()=>{
  resize();
  renderer.clear();
  renderer.render(scene,camera);
});


/* 描画経路の最低限の健全性チェック。エラーでゲーム全体を止めず、
   WebGLコンテキストが失われた場合だけ警告を出す。 */
canvas.addEventListener('webglcontextlost',e=>{
  e.preventDefault();
  console.warn('WebGL context lost');
});

canvas.addEventListener('webglcontextrestored',()=>{
  console.info('WebGL context restored');
  resize();
  rebuildMap();
  renderAll();
  renderer.clear();
  renderer.render(scene,camera);
});

let last=
  performance.now();


let saveTick=0;

let renderTick=0;

function loop(t){

  const dt=
    Math.min(
      1,
      (t-last)/1000
    );


  last=t;


  simulate(
    dt
  );


  saveTick+=dt;

  renderTick+=dt;


  /*
    自動保存
  */

  if(
    saveTick>=120
  ){

    saveGameSilent();


    saveTick=0;

  }


  /*
    UI更新
  */

  if(
    renderTick>.25
  ){

    const housing=
      getHousingState();

    /*
      家の増減があった瞬間だけ
      住宅街を作り直す。
    */
    if(
      housing.houses !==
      lastHouseCount
    ){

      const p=
        eraPalette();

      buildResidentialCity(
        p
      );

      lastHouseCount=
        housing.houses;

    }

    renderAll();

    renderTick=0;

  }


  animateCitizenAgents(dt,t);

  controls.update();


  renderer.clear();
  renderer.render(
    scene,
    camera
  );


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);
